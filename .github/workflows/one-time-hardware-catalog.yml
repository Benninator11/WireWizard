name: One-time WireWizard hardware catalog update
on:
  push:
    branches: [main]
    paths:
      - ".staging/trigger.txt"
permissions:
  contents: write
jobs:
  update-hardware-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply supplied CPU and GPU catalogs
        run: python .staging/update_catalog.py
      - name: Commit final files and remove temporary updater
        run: |
          rm -f .staging/update_catalog.py .staging/archive.parts/*.b64
          rmdir .staging/archive.parts .staging 2>/dev/null || true
          rm -f .github/workflows/one-time-hardware-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "WireWizard: CPU- und GPU-Datenbank aktualisieren"
          git push origin HEAD:main
