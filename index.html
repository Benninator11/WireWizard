  <script>
    function decodeEmbeddedHtml(elementId) {
      const encoded = document.getElementById(elementId).textContent.replace(/\s/g, "");
      const binary = atob(encoded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    const serverView = document.getElementById("server-view");
    const cableView = document.getElementById("cable-view");
    const serverButton = document.getElementById("show-server");
    const cableButton = document.getElementById("show-cable");
    const modeSwitch = document.querySelector(".mode-switch");
    let currentLanguage = "de";

    function updateModeSwitchLanguage() {
      const english = currentLanguage === "en";
      document.documentElement.lang = currentLanguage;
      document.title = english ? "Server & Cable Planner" : "Server- und Kabelplaner";
      modeSwitch.setAttribute("aria-label", english ? "Choose planner" : "Planer auswählen");
      serverButton.textContent = english ? "Server planner" : "Serverplaner";
      cableButton.textContent = english ? "Cable planner" : "Kabelplaner";
      document.getElementById("project-tag").title = english ? "Project by Benninator111" : "Projekt von Benninator111";
      serverView.title = english ? "Server planner" : "Serverplaner";
      cableView.title = english ? "Cable planner" : "Kabelplaner";
    }

    function syncPlannerLanguage(lang) {
      if (!['de', 'en'].includes(lang)) return;
      currentLanguage = lang;
      updateModeSwitchLanguage();
      [serverView, cableView].forEach((frame) => {
        try {
          if (frame.contentWindow) frame.contentWindow.postMessage({ type: "planner-set-language", lang }, "*");
        } catch (_) {}
      });
    }

    function showView(which) {
      const showServer = which === "server";
      serverView.hidden = !showServer;
      cableView.hidden = showServer;
      serverButton.classList.toggle("active", showServer);
      cableButton.classList.toggle("active", !showServer);
      serverButton.setAttribute("aria-pressed", String(showServer));
      cableButton.setAttribute("aria-pressed", String(!showServer));
    }

    serverView.addEventListener("load", () => {
      if (serverView.contentWindow) serverView.contentWindow.postMessage({ type: "planner-set-language", lang: currentLanguage }, "*");
    });
    cableView.addEventListener("load", () => {
      if (cableView.contentWindow) cableView.contentWindow.postMessage({ type: "planner-set-language", lang: currentLanguage }, "*");
    });
    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message && message.type === "planner-language-change") syncPlannerLanguage(message.lang);
    });

    serverView.srcdoc = decodeEmbeddedHtml("server-html-b64");
    cableView.srcdoc = decodeEmbeddedHtml("cable-html-b64");
    updateModeSwitchLanguage();
    serverButton.addEventListener("click", () => showView("server"));
    cableButton.addEventListener("click", () => showView("cable"));
  </script>
