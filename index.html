<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202a35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>WireWizard & ServerWizard</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f3f6fb;color:#1d2a39}body{display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;background:#202a35;color:#fff}.bar strong{margin-right:auto}.bar button{min-height:44px;padding:8px 15px;border:1px solid #647386;border-radius:9px;background:#2e3b49;color:#fff;font-weight:700}.bar button.active{background:#2f6fed;border-color:#2f6fed}.bar button:focus-visible{outline:3px solid #8db4ff;outline-offset:2px}#planner{border:0;width:100%;flex:1;min-height:0;background:white}@media(max-width:520px){.bar{gap:6px;padding:7px}.bar strong{width:100%}.bar button{flex:1}}@media(prefers-reduced-motion:no-preference){.bar button{transition:background .18s,transform .18s}.bar button:active{transform:scale(.98)}}</style></head><body><nav class="bar"><strong>WireWizard / ServerWizard</strong><button id="server" type="button">ServerWizard</button><button id="wire" type="button">WireWizard</button></nav><iframe id="planner" title="Planer"></iframe><script>
const frame=document.getElementById('planner'),buttons={server:document.getElementById('server'),wire:document.getElementById('wire')};let hardwarePromise=null;
function loadHardware(){if(!hardwarePromise)hardwarePromise=fetch('hardware-data.json').then(r=>{if(!r.ok)throw Error('Hardwaredaten konnten nicht geladen werden');return r.json()}).then(data=>{window.WIZARD_HARDWARE_DATA=data;try{frame.contentWindow.postMessage({type:'wizard-hardware-data',data},location.origin)}catch(e){}return data});return hardwarePromise}
function route(){let which=location.hash.replace('#','').toLowerCase();if(!['server','wire'].includes(which))which='server';for(const k of Object.keys(buttons))buttons[k].classList.toggle('active',k===which);document.title=which==='server'?'ServerWizard':'WireWizard';const wanted=which==='server'?'server.html':'wire.html';if(!frame.src.endsWith('/'+wanted)&&!frame.src.endsWith(wanted))frame.src=wanted;if(which==='server')loadHardware().catch(e=>console.warn(e));}
buttons.server.addEventListener('click',()=>location.hash='server');buttons.wire.addEventListener('click',()=>location.hash='wire');window.addEventListener('hashchange',route);frame.addEventListener('load',()=>{if(window.WIZARD_HARDWARE_DATA)frame.contentWindow.postMessage({type:'wizard-hardware-data',data:window.WIZARD_HARDWARE_DATA},location.origin)});route();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
</script></body></html>
