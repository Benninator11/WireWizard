<script>
(function () {
  const root = document.querySelector('.canvas-shell');
  const content = document.querySelector('.canvas-content');

  // Drag an empty part of the canvas to move around a large plan.
  if (root && content) {
    let pan = false;
    let startX = 0;
    let startY = 0;
    let originX = 0;
    let originY = 0;

    root.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.device, button, input, select, textarea, .cable-path')) return;

      pan = true;
      startX = event.clientX;
      startY = event.clientY;

      const transform = new DOMMatrix(getComputedStyle(content).transform);
      originX = transform.m41;
      originY = transform.m42;
      root.setPointerCapture?.(event.pointerId);
      root.style.cursor = 'grabbing';
    });

    root.addEventListener('pointermove', (event) => {
      if (!pan) return;

      const x = originX + event.clientX - startX;
      const y = originY + event.clientY - startY;
      content.style.transform = `translate(${x}px, ${y}px)`;
    });

    const stop = () => {
      pan = false;
      root.style.cursor = '';
    };

    root.addEventListener('pointerup', stop);
    root.addEventListener('pointercancel', stop);
    content.style.transformOrigin = '0 0';
  }

  // Add a small search box above the device-type list.
  const deviceType = document.querySelector('#deviceType');
  if (deviceType && !document.querySelector('#deviceTypeSearch')) {
    const search = document.createElement('input');
    search.id = 'deviceTypeSearch';
    search.type = 'search';
    search.placeholder = 'Gerät suchen …';
    search.setAttribute('aria-label', 'Gerätetyp suchen');
    search.style.cssText = 'width:100%;box-sizing:border-box;margin:0 0 6px;padding:8px;border-radius:8px;';
    deviceType.parentElement.insertBefore(search, deviceType);

    search.addEventListener('input', () => {
      const query = search.value.toLocaleLowerCase();
      [...deviceType.options].forEach((option) => {
        option.hidden = !option.textContent.toLocaleLowerCase().includes(query);
      });
    });

    deviceType.addEventListener('change', () => {
      search.value = '';
      [...deviceType.options].forEach((option) => {
        option.hidden = false;
      });
    });
  }

  // Keep the workspace much larger than the visible window so it can be explored freely.
  const canvas = document.querySelector('.canvas');
  if (canvas) {
    canvas.style.width = '100000px';
    canvas.style.height = '100000px';
  }
})();

<script>
(function () {

<script>
(function () {
  'use strict';

  // Cable colours are set by type, with the existing per-cable picker still taking priority.
  const cableTypeColorsStorageKey = 'wirewizard-cable-type-colors-v1';
  const cableTypeColors = (() => {
    try {
      const stored = JSON.parse(localStorage.getItem(cableTypeColorsStorageKey) || '{}');
      return stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
    } catch (_) {
      return {};
    }
  })();
  window.__wireWizardCableTypeColors = cableTypeColors;

  const cableTypeColorStyle = document.createElement('style');
  cableTypeColorStyle.textContent = `
    .cable-type-colors-panel { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); }
    .cable-type-colors-panel > summary { padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); }
    .cable-type-colors-list { display: grid; gap: 6px; max-height: 260px; overflow: auto; padding: 0 9px 9px; }
    .cable-type-color-row { display: grid; grid-template-columns: minmax(0,1fr) 35px auto; gap: 6px; align-items: center; font-size: 12px; }
    .cable-type-color-row span { overflow-wrap: anywhere; }
    .cable-type-color-row input[type="color"] { width: 35px; height: 27px; padding: 2px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); cursor: pointer; }
    .cable-type-color-reset { border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); padding: 4px 5px; font-size: 10px; cursor: pointer; }
    .cable-type-color-reset:hover { background: var(--panel-soft); }
  `;
  document.head.appendChild(cableTypeColorStyle);

  const colorPanel = document.createElement('details');
  colorPanel.className = 'cable-type-colors-panel';
  colorPanel.innerHTML = '<summary id="cableTypeColorsSummary">Kabelfarben nach Typ</summary><div class="cable-type-colors-list" id="cableTypeColorsList"></div>';
  const cableTypeSection = document.getElementById('cableTypeSelect')?.closest('.sidebar-section');
  if (cableTypeSection) cableTypeSection.insertAdjacentElement('afterend', colorPanel);

  function defaultCableColor(type) {
    return cableColors[type] || cableColors.Sonstiges || '#7c8aa5';
  }

  function saveCableTypeColors() {
    try { localStorage.setItem(cableTypeColorsStorageKey, JSON.stringify(cableTypeColors)); } catch (_) {}
  }

  function applyCableTypeColor(type, color) {
    state.cables.forEach((cable) => {
      if (cable.type !== type || cable.colorSource === 'custom') return;
      cable.color = color;
      cable.colorSource = 'type';
    });
    saveState();
    render();
  }

  function renderCableTypeColorRows() {
    const list = document.getElementById('cableTypeColorsList');
    if (!list) return;
    list.replaceChildren();
    [...new Set(cableTypes)].forEach((type) => {
      const row = document.createElement('label');
      row.className = 'cable-type-color-row';
      const name = document.createElement('span');
      name.textContent = getCableTypeLabel(type);
      const input = document.createElement('input');
      input.type = 'color';
      input.value = cableTypeColors[type] || defaultCableColor(type);
      input.setAttribute('aria-label', (state.lang === 'en' ? 'Cable colour: ' : 'Kabelfarbe: ') + getCableTypeLabel(type));
      input.title = (state.lang === 'en' ? 'Set default colour for ' : 'Standardfarbe für ') + getCableTypeLabel(type);
      input.addEventListener('change', () => {
        cableTypeColors[type] = input.value;
        window.__wireWizardCableTypeColors = cableTypeColors;
        saveCableTypeColors();
        applyCableTypeColor(type, input.value);
      });

      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'cable-type-color-reset';
      reset.textContent = state.lang === 'en' ? 'Default' : 'Standard';
      reset.title = state.lang === 'en' ? 'Restore the standard colour' : 'Standardfarbe wiederherstellen';

        delete cableTypeColors[type];
        window.__wireWizardCableTypeColors = cableTypeColors;
        saveCableTypeColors();
        applyCableTypeColor(type, defaultCableColor(type));
        renderCableTypeColorRows();
      });
      row.append(name, input, reset);
      list.appendChild(row);
    });
  }

  const baseGetCableColor = getCableColor;
  getCableColor = function (type) {
    return cableTypeColors[type] || baseGetCableColor(type);
  };

  const updateCableColorPanelLanguage = () => {
    const summary = document.getElementById('cableTypeColorsSummary');
    if (summary) summary.textContent = state.lang === 'en' ? 'Cable colours by type' : 'Kabelfarben nach Typ';
    renderCableTypeColorRows();
  };

      render();

  });

      .modal-actions {

        gap: 10px;
        margin-top: 18px;
        padding-top: 14px;

      .hardware-options {
        max-height: 210px;

        border: 1px solid var(--border);

        display: block;

        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: rgba(29, 42, 57, 0.96);

    <div class="app">

            <div class="form-grid">

              </div>

              </div>

      function loadState() {

          if (!parsed || !Array.isArray(parsed.devices)) return;
          state.lang = parsed.lang || 'de';
          state.theme = parsed.theme === 'dark' ? 'dark' : 'light';
          state.zoom = Number.isFinite(Number(parsed.zoom)) ? clamp(Number(parsed.zoom), MIN_ZOOM, MAX_ZOOM) : 1;
          state.selectedCableType = parsed.selectedCableType || 'LAN';
          state.nextCounter = Number(parsed.nextCounter || 1);
          state.devices = new Map((parsed.devices || []).map((device) => [device.id, device]));
          state.cables = new Map((parsed.cables || []).map((cable) => [cable.id, cable]));
        } catch (error) {
          console.error('Could not load state', error);

      function estimateGpuPowerWatt(model, deviceType) {

      function estimateSelectedHardwarePowerWatt(deviceType, cpuModel, gpuModel) {
        const cpu = String(cpuModel || '').trim();
        const gpu = String(gpuModel || '').trim();
        if (!cpu && !gpu) return getDefaultPowerWatt(deviceType);
        const base = hardwareBasePowerWattByType[deviceType] ?? Math.max(15, Math.round(getDefaultPowerWatt(deviceType) * 0.2));
        return Math.round(base + estimateCpuPowerWatt(cpu, deviceType) + estimateGpuPowerWatt(gpu, deviceType));
      }

      function updatePowerEstimateFromHardware() {
        const deviceType = ui.deviceType.value;
        const cpuModel = hardwareSpecTypes.has(deviceType) ? ui.cpuModel.value : '';
        const gpuModel = gpuSpecTypes.has(deviceType) ? ui.gpuModel.value : '';
        ui.devicePowerWatt.value = estimateSelectedHardwarePowerWatt(deviceType, cpuModel, gpuModel);
        ui.devicePowerWatt.dataset.customized = 'false';
      }

      function hasPowerInput(ports, powerWatt) {
        return ports.some((port) => isPowerPort(port.type)) || (
          Number(powerWatt) <= 100 && ports.some((port) => (port.type || '').trim().toLowerCase() === 'lan')
        );
      }

      function calculateTotalPower() {
        let total = 0;
        state.devices.forEach((device) => {
          const watt = Number(device.powerWatt) || 0;
          total += watt;
        });
        return total;
      }

      function getConnectedEndpoint(device, port) {
        const cable = port.cableId ? state.cables.get(port.cableId) : null;
        if (!cable) return null;
        if (cable.fromDeviceId === device.id && cable.fromPortId === port.id) {
          const otherDevice = getDeviceById(cable.toDeviceId);
          return otherDevice ? { device: otherDevice, port: getPortById(otherDevice.id, cable.toPortId) } : null;
        }
        if (cable.toDeviceId === device.id && cable.toPortId === port.id) {
          const otherDevice = getDeviceById(cable.fromDeviceId);
          return otherDevice ? { device: otherDevice, port: getPortById(otherDevice.id, cable.fromPortId) } : null;
        }
        return null;
      }

      function calculateDeviceLoad(device, visited = new Set()) {
        if (!device) return 0;
        if (device.type !== 'Steckdose' && device.type !== 'Steckdosenleiste') return Number(device.powerWatt) || 0;
        if (visited.has(device.id)) return 0;
        visited.add(device.id);
        const total = device.ports
          .filter((port) => port.powerRole === 'outlet')
          .reduce((sum, port) => sum + calculateOutletLoad(device, port, visited), 0);
        visited.delete(device.id);
        return total;
      }

      function calculateOutletLoad(device, port, visited = new Set()) {
        const endpoint = getConnectedEndpoint(device, port);
        return endpoint ? calculateDeviceLoad(endpoint.device, visited) : 0;
      }

      function renderPowerBar() {
        const total = calculateTotalPower();
        const percent = clamp((total / state.maxPowerWatt) * 100, 0, 100);
        const warning = total > state.maxPowerWatt;
        ui.powerFill.style.width = `${percent}%`;
        ui.powerLabel.textContent = `${t('power')}: ${total} / ${state.maxPowerWatt} W`;
        ui.powerWrap.classList.toggle('warning', warning);
        if (warning) {
          ui.powerLabel.title = t('warnOverLimit');
        } else {
          ui.powerLabel.title = 'OK';
        }
      }

      // Port configuration and cable compatibility.
      function getPortSpeedOptions(portType) {
        const base = portType.toLowerCase();
        if (base.includes('lan')) return ['100 Mbps', '1 GbE', '2.5 GbE', '10 GbE'];
        if (base.includes('usb')) return ['1.1', '2.0', '3.0', '3.1', '3.2', 'USB-C'];
        if (base.includes('thunderbolt')) return ['3', '4', '5'];
        if (base.includes('hdmi')) return ['HDMI 1.4', 'HDMI 2.0', 'HDMI 2.1'];
        if (base.includes('displayport')) return ['1.2', '1.4', '2.0', '2.1'];
        if (base.includes('vga')) return ['VGA'];
        if (base.includes('dvi')) return ['DVI-D', 'DVI-I'];
        if (base.includes('klinke') || base.includes('cinch') || base.includes('xlr')) return ['3,5 mm', '6,3 mm', 'RCA', 'XLR'];
        if (base.includes('sfp')) return ['SFP', 'SFP+'];
        if (base.includes('sd')) return ['SD', 'SDHC', 'SDXC'];
        if (base.includes('lightning')) return ['Lightning'];
        return ['Standard'];
      }

      function formatPortLabel(portType, speed) {
        if (!speed || speed === 'Standard') return portType;
        return `${portType} ${speed}`;
      }

      function getPortShortLabel(portType, speed) {
        const type = (portType || '').trim();
        const speedText = ((speed || '').trim() || type).trim();
        const lowerType = type.toLowerCase();

        if (lowerType === 'usb-c') return 'UC';
        if (lowerType.includes('usb') || lowerType.startsWith('usb')) {
          const match = (speedText.match(/\d+(?:\.\d+)?/) || [''])[0];
          const main = match.includes('.') ? match.split('.')[0] : match;
          return match ? `U${main}` : 'U';
        }
        if (lowerType.includes('lan')) return 'L';
        if (lowerType.includes('thunderbolt')) return 'T';
        if (lowerType.includes('hdmi')) return 'H';
        if (lowerType.includes('displayport')) return 'DP';
        if (lowerType.includes('vga')) return 'V';
        if (lowerType.includes('dvi')) return 'D';
        if (lowerType.includes('sfp')) return 'S';
        if (lowerType.includes('lightning')) return 'Li';
        if (lowerType.includes('sd')) return 'SD';
        return type.slice(0, 2).toUpperCase();
      }

      function createPortRow(port = null) {
        const row = document.createElement('div');
        row.className = 'port-check';

        const typeSelect = document.createElement('select');
        typeSelect.dataset.role = 'type';
        portCatalog.forEach((portType) => {
          const option = document.createElement('option');
          option.value = portType;
          option.textContent = getPortTypeLabel(portType);
          typeSelect.appendChild(option);
        });
        typeSelect.value = port ? port.type : 'LAN';

        const sideSelect = document.createElement('select');
        sideSelect.dataset.role = 'side';
        sideSelect.innerHTML = ['left', 'right', 'top', 'bottom'].map((side) => `
          <option value="${side}">${getPortSideLabel(side)}</option>
        `).join('');
        sideSelect.value = port ? (port.side || 'right') : 'right';

        const speedSelect = document.createElement('select');
        speedSelect.dataset.role = 'speed';
        const basePortType = (port ? port.type : typeSelect.value);
        const speedOptions = getPortSpeedOptions(basePortType);
        speedOptions.forEach((speed) => {
          const option = document.createElement('option');
          option.value = speed;
          option.textContent = getPortSpeedLabel(speed);
          speedSelect.appendChild(option);
        });
        speedSelect.value = port && port.speed ? port.speed : (speedOptions[0] || 'Standard');

        typeSelect.addEventListener('change', () => {
          const nextOptions = getPortSpeedOptions(typeSelect.value);
          speedSelect.innerHTML = '';
          nextOptions.forEach((speed) => {
            const option = document.createElement('option');
            option.value = speed;
            option.textContent = speed;
            speedSelect.appendChild(option);
          });
          speedSelect.value = nextOptions[0] || 'Standard';
        });

        const amountInput = document.createElement('input');
        amountInput.type = 'number';
        amountInput.min = '1';
        amountInput.max = '99';
        amountInput.value = port && port.amount ? port.amount : 1;
        amountInput.dataset.role = 'amount';

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = '×';
        removeBtn.addEventListener('click', () => {
          if (ui.portConfig.children.length > 1) row.remove();
        });

        row.appendChild(typeSelect);
        row.appendChild(sideSelect);
        row.appendChild(speedSelect);
        row.appendChild(amountInput);
        row.appendChild(removeBtn);
        return row;
      }

        const grouped = new Map();

          const key = `${port.type}|${port.side || 'right'}|${port.speed || 'Standard'}`;

          current.amount += 1;

      const MOBILE_DEVICE_TYPES = new Set(['Mini-PC', 'Laptop', 'Gaming-Mini-PC', 'Gaming-Laptop']);

      function isMobileDeviceType(type) {
        return MOBILE_DEVICE_TYPES.has(type);
      }

      function isMobileCpuName(name) {
        return /mobile|laptop|notebook|snapdragon|apple\s+[am]\d|mediatek|dimensity|exynos|arm cortex|celeron n\d|pentium silver n|atom x[357]|ryzen z\d|ryzen ai/i.test(name)
          || /\b(?:ryzen|athlon)\b.*\b\d{3,4}(?:HS|HX|U|H|C)\b/i.test(name)
          || /\bIntel Core i[3579]-?\d{4,5}(?:U|H|HK|HQ|HX|Y|P|V|M|G[1-7])\b/i.test(name)
          || /\bIntel Core Ultra\b.*\b\d{3,5}(?:U|H|V|P)\b/i.test(name)
          || /\bRyzen AI\b/i.test(name);
      }

      function isMobileGpuName(name) {
        // UHD 730/750/770 are desktop iGPUs, not laptop/mini-PC mobile models.
        if (/intel uhd graphics (?:730|750|770)\b/i.test(name)) return false;
        return /laptop gpu|mobile|max-q|nvidia geForce mx\d{3}\b|intel arc [ab]\d{3,4}m\b|\b(?:gtx|rtx|quadro)\s*\d{3,4}m\b|radeon.*\b\d{3,4}[ms]\b|intel (?:uhd|iris|hd graphics)|intel arc graphics|amd radeon graphics|adreno|mali|apple.*gpu/i.test(name);
      }

      function getCompatibleCpuNames(type) {
        return isMobileDeviceType(type) ? cpuNames.filter(isMobileCpuName) : cpuNames;
      }

      function getCompatibleGpuNames(type) {
        return isMobileDeviceType(type) ? gpuNames.filter(isMobileGpuName) : gpuNames;
      }

      function populateHardwareLists() {
        const bindSearchList = (inputId, listId, names) => {
          const input = document.getElementById(inputId);
          const list = document.getElementById(listId);
          const wrapper = input.closest('.field');
          const closeList = () => {
            list.classList.add('hidden');
            input.setAttribute('aria-expanded', 'false');
          };
          const renderOptions = () => {
            const availableNames = typeof names === 'function' ? names() : names;
            const query = input.value.trim().toLocaleLowerCase();
            const matches = query ? availableNames.filter((name) => name.toLocaleLowerCase().includes(query)) : availableNames;
            const options = document.createDocumentFragment();
            matches.forEach((name) => {
              const option = document.createElement('button');
              option.type = 'button';
              option.className = 'hardware-option';
              option.setAttribute('role', 'option');
              option.textContent = name;
              option.addEventListener('click', () => {
                input.value = name;
                input.dispatchEvent(new Event('change', { bubbles: true }));
                closeList();
              });
              options.appendChild(option);
            });
            list.replaceChildren(options);
            list.classList.remove('hidden');
            input.setAttribute('aria-expanded', 'true');
          };

          input.addEventListener('focus', renderOptions);
          input.addEventListener('input', renderOptions);
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeList();
            if (event.key === 'ArrowDown' && list.firstElementChild) {
              event.preventDefault();
              list.firstElementChild.focus();
            }
            if (event.key === 'Enter' && !list.classList.contains('hidden') && list.firstElementChild) {
              event.preventDefault();
              list.firstElementChild.click();
            }
          });
          list.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
              closeList();
              input.focus();
            }
          });
          document.addEventListener('click', (event) => {
            if (!wrapper.contains(event.target)) closeList();
          });
        };
        bindSearchList('deviceCpuModel', 'cpuModelOptions', () => getCompatibleCpuNames(ui.deviceType.value));
        bindSearchList('deviceGpuModel', 'gpuModelOptions', () => getCompatibleGpuNames(ui.deviceType.value));
      }

      function syncHardwareFields(device = null) {
        const type = ui.deviceType.value;
        const supportsHardware = hardwareSpecTypes.has(type);
        const supportsGpu = gpuSpecTypes.has(type);
        if (isMobileDeviceType(type)) {
          if (ui.cpuModel.value && !getCompatibleCpuNames(type).includes(ui.cpuModel.value)) ui.cpuModel.value = '';
          if (ui.gpuModel.value && !getCompatibleGpuNames(type).includes(ui.gpuModel.value)) ui.gpuModel.value = '';
        }
        ui.cpuModelField.classList.toggle('hidden', !supportsHardware);
        ui.ramField.classList.toggle('hidden', !supportsHardware);
        ui.ramTypeField.classList.toggle('hidden', !supportsHardware);
        ui.gpuModelField.classList.toggle('hidden', !supportsGpu);
        ui.raspberryPiVersionField.classList.toggle('hidden', type !== 'Raspberry Pi');
        if (device) {
          ui.cpuModel.value = device.cpuModel || '';
          ui.ramGb.value = device.ramGb ? String(device.ramGb) : '';
          ui.ramType.value = device.ramType || '';
          ui.gpuModel.value = device.gpuModel || '';
          ui.raspberryPiVersion.value = device.raspberryPiVersion || '5';
        } else {
          if (!supportsHardware) { ui.cpuModel.value = ''; ui.ramGb.value = ''; ui.ramType.value = ''; }
          if (!supportsGpu) ui.gpuModel.value = '';
          if (type === 'Raspberry Pi' && !ui.raspberryPiVersion.value) ui.raspberryPiVersion.value = '5';
        }
      }

      function syncDeviceTypeControls(device = null) {
        syncHardwareFields(device);
        const isStrip = ui.deviceType.value === 'Steckdosenleiste';
        const isSocket = ui.deviceType.value === 'Steckdose';
        const hidePorts = isStrip || isSocket;
        ui.outletCountField.classList.toggle('hidden', !isStrip);
        ui.portConfig.parentElement.classList.toggle('hidden', hidePorts);
        document.getElementById('addPortRowBtn').classList.toggle('hidden', hidePorts);

        if (isStrip) {
          const outletCount = device

          ui.outletCountInput.value = clamp(outletCount || 6, 1, 20);

      function getDeviceById(id) {
        return state.devices.get(id) || null;
      }

      function getPortById(deviceId, portId) {
        const device = getDeviceById(deviceId);
        if (!device) return null;
        return device.ports.find((port) => port.id === portId) || null;
      }

      function getCableColor(type) {
        const customColors = window.__wireWizardCableTypeColors || {};
        return customColors[type] || cableColors[type] || cableColors.Sonstiges;
      }

      const cableColorPalette = [
        '#e63946', '#0077b6', '#2a9d8f', '#f4a261', '#7b2cbf', '#d63384',
        '#588157', '#e9c46a', '#264653', '#ff6b35', '#495057', '#00a896',
      ];

      function hueToHex(hue) {
        const chroma = 0.7 * (1 - Math.abs(2 * 0.46 - 1));
        const segment = hue / 60;
        const secondary = chroma * (1 - Math.abs(segment % 2 - 1));
        const offset = 0.46 - chroma / 2;
        let rgb;
        if (segment < 1) rgb = [chroma, secondary, 0];
        else if (segment < 2) rgb = [secondary, chroma, 0];
        else if (segment < 3) rgb = [0, chroma, secondary];
        else if (segment < 4) rgb = [0, secondary, chroma];
        else if (segment < 5) rgb = [secondary, 0, chroma];
        else rgb = [chroma, 0, secondary];
        return `#${rgb.map((value) => Math.round((value + offset) * 255).toString(16).padStart(2, '0')).join('')}`;
      }

      function getUniqueCableColor() {
        const usedColors = new Set([...state.cables.values()].map((cable) => {
          return (cable.color || getCableColor(cable.type)).toLowerCase();
        }));
        const paletteColor = cableColorPalette.find((color) => !usedColors.has(color));
        if (paletteColor) return paletteColor;

        for (let index = 0; index < 360; index++) {
          const color = hueToHex((index * 137.508) % 360);
          if (!usedColors.has(color)) return color;
        }
        return '#000000';
      }

      function getCompatibleCableTypes(portType) {
        const type = (portType || '').trim().toLowerCase();
        if (type.includes('usb-pd')) return ['USB-PD', 'Stromkabel'];
        if (type === 'usb-c') return ['USB', 'USB-PD', 'Thunderbolt', 'Stromkabel'];
        if (type.includes('usb')) return ['USB', 'Stromkabel'];
        if (type.includes('lan') || type.includes('ethernet') || type.includes('rj45')) return ['LAN', 'Cat6', 'Fiber', 'DAC', 'PoE'];
        if (type.includes('thunderbolt')) return ['Thunderbolt'];
        if (type.includes('hdmi')) return ['HDMI'];
        if (type.includes('displayport')) return ['DisplayPort'];
        if (type.includes('vga')) return ['VGA'];
        if (type.includes('dvi')) return ['DVI'];
        if (type.includes('klinke') || type.includes('cinch') || type.includes('xlr')) return ['Audio'];
        if (type === 'ps/2') return ['PS/2'];
        if (type === 'serial') return ['Serial'];
        if (type === 'parallel') return ['Parallel'];
        if (type === 'schuko' || type.includes('iec c')) return ['Strom', 'Stromkabel'];
        if (type === 'dc-in') return ['dc-in', 'Stromkabel'];
        if (type.includes('lightning')) return ['Lightning'];
        if (type.includes('sfp')) return ['SFP', 'Fiber', 'DAC'];
        if (type.includes('sd')) return ['SD'];
        if (type === 'cf') return ['CF'];
        if (type === 'cfexpress') return ['CFexpress'];
        return ['Sonstiges'];
      }
      function isCableCompatible(port, cableType, device = null) {
        if (!port || !getCompatibleCableTypes(port.type).includes(cableType)) return false;
        if (cableType === 'PoE') return Number(device && device.powerWatt) <= 100;
        return true;
      }

      function randomPosition(w = 190, h = 135) {
        const margin = 40;
        const shell = ui.canvas.parentElement;
        const contentRect = ui.canvasContent.getBoundingClientRect();
        const shellRect = shell.getBoundingClientRect();
        const scaleX = contentRect.width / ui.canvasContent.offsetWidth;
        const scaleY = contentRect.height / ui.canvasContent.offsetHeight;
        const visibleLeft = clamp(Math.max(contentRect.left, shellRect.left + shell.clientLeft, 0), contentRect.left, contentRect.right);
        const visibleRight = clamp(Math.min(contentRect.right, shellRect.left + shell.clientLeft + shell.clientWidth, window.innerWidth), contentRect.left, contentRect.right);
        const visibleTop = clamp(Math.max(contentRect.top, shellRect.top + shell.clientTop, 0), contentRect.top, contentRect.bottom);
        const visibleBottom = clamp(Math.min(contentRect.bottom, shellRect.top + shell.clientTop + shell.clientHeight, window.innerHeight), contentRect.top, contentRect.bottom);
        const visibleMinX = clamp((visibleLeft - contentRect.left) / scaleX, 0, ui.canvasContent.offsetWidth);
        const visibleMaxX = clamp((visibleRight - contentRect.left) / scaleX, 0, ui.canvasContent.offsetWidth);
        const visibleMinY = clamp((visibleTop - contentRect.top) / scaleY, 0, ui.canvasContent.offsetHeight);
        const visibleMaxY = clamp((visibleBottom - contentRect.top) / scaleY, 0, ui.canvasContent.offsetHeight);
        const canvasMaxX = Math.max(0, ui.canvasContent.offsetWidth - w);
        const canvasMaxY = Math.max(0, ui.canvasContent.offsetHeight - h);
        let minX = Math.max(margin, visibleMinX);
        let maxX = Math.min(canvasMaxX - margin, visibleMaxX - w);
        let minY = Math.max(margin, visibleMinY);
        let maxY = Math.min(canvasMaxY - margin, visibleMaxY - h);

        if (maxX < minX) minX = maxX = clamp((visibleMinX + visibleMaxX - w) / 2, 0, canvasMaxX);
        if (maxY < minY) minY = maxY = clamp((visibleMinY + visibleMaxY - h) / 2, 0, canvasMaxY);

        let x = minX + Math.random() * Math.max(0, maxX - minX);
        let y = minY + Math.random() * Math.max(0, maxY - minY);
        let attempts = 0;
        while (attempts < 300) {
          const collision = [...state.devices.values()].some((device) => {
            return !(x + w < device.x - 30 || x > device.x + device.w + 30 || y + h < device.y - 30 || y > device.y + device.h + 30);
          });
          if (!collision) return { x: clamp(x, minX, maxX), y: clamp(y, minY, maxY) };
          x = minX + Math.random() * Math.max(0, maxX - minX);
          y = minY + Math.random() * Math.max(0, maxY - minY);
          attempts++;
        }
        return { x: minX, y: minY };
      }

      function updateDeviceForm(device) {
        if (!device) {
          ui.deviceName.value = '';
          ui.deviceDescription.value = '';
          ui.deviceStorageValue.value = 0;
          ui.deviceStorageUnit.value = 'GB';
          ui.deviceType.value = deviceTypes[0];
          ui.cpuModel.value = ''; ui.ramGb.value = ''; ui.ramType.value = ''; ui.gpuModel.value = ''; ui.raspberryPiVersion.value = '5';
          ui.devicePowerWatt.dataset.customized = 'false';
          ui.devicePowerWatt.value = getDefaultPowerWatt(ui.deviceType.value);
          populatePortConfig(null);
          syncDeviceTypeControls(null);
          ui.modalTitle.textContent = t('addDevice');
          ui.deleteDeviceBtn.classList.add('hidden');
          return;
        }

        ui.deviceName.value = device.name || '';
        ui.deviceDescription.value = device.description || '';
        ui.deviceStorageValue.value = device.storage || 0;
        ui.deviceStorageUnit.value = device.storageUnit || 'GB';
        ui.devicePowerWatt.value = device.powerWatt ?? getDefaultPowerWatt(device.type);
        ui.devicePowerWatt.dataset.customized = 'true';
        ui.deviceType.value = device.type || deviceTypes[0];
        populatePortConfig(device);
        syncDeviceTypeControls(device);
        ui.modalTitle.textContent = device.name || t('device');
        ui.deleteDeviceBtn.classList.remove('hidden');
      }

      function openDeviceModal(deviceId = null) {
        if (deviceId) {
          const device = getDeviceById(deviceId);
          if (!device) return;
          state.openDeviceId = deviceId;
          ui.modal.classList.remove('hidden');
          updateDeviceForm(device);
        } else {
          state.openDeviceId = null;
          ui.modal.classList.remove('hidden');
          updateDeviceForm(null);
        }
      }

      function closeDeviceModal() {
        state.openDeviceId = null;
        ui.modal.classList.add('hidden');
      }

      function buildPortListFromForm(device) {
        const selected = [];
        const rows = [...ui.portConfig.children];
        rows.forEach((row) => {
          const typeSelect = row.querySelector('[data-role="type"]');
          const sideSelect = row.querySelector('[data-role="side"]');
          const speedSelect = row.querySelector('[data-role="speed"]');
          const amountInput = row.querySelector('[data-role="amount"]');
          if (!typeSelect || !sideSelect || !speedSelect || !amountInput) return;

          const portType = typeSelect.value;
          const speed = speedSelect.value || 'Standard';
          const amount = Math.max(1, Number(amountInput.value || 1));
          const label = formatPortLabel(portType, speed);

          for (let i = 0; i < amount; i++) {
            const matchedPort = device ? device.ports.find((p) => p.type === portType && p.speed === speed && p.side === sideSelect.value && (!p.cableId || p.cableId === null || true)) : null;
            const portId = matchedPort ? matchedPort.id : uid('port');
            selected.push({
              id: portId,
              type: portType,
              label,
              side: sideSelect.value,
              speed,
              amount,
              cableId: matchedPort ? matchedPort.cableId : null,
            });
          }
        });

        return selected.length ? selected : [{ id: uid('port'), type: 'Schuko', label: 'Schuko', side: 'left', speed: 'Standard', amount: 1, cableId: null }];
      }

      function buildSocketPorts(device, outletCount) {
        const previousPorts = device ? device.ports || [] : [];
        const existingInput = previousPorts.find((port) => port.powerRole === 'input');
        const existingOutlets = previousPorts.filter((port) => port.powerRole === 'outlet');
        const inputPort = {
          ...(existingInput || {}),
          id: existingInput ? existingInput.id : uid('port'),
          type: 'Schuko',
          label: 'Stromanschluss',
          side: 'left',
          speed: 'Standard',
          powerRole: 'input',
          cableId: existingInput ? existingInput.cableId : null,
        };
        const outlets = Array.from({ length: outletCount }, (_, index) => {
          const outletNumber = index + 1;
          const previous = existingOutlets.find((port) => port.outletNumber === outletNumber);
          return {
            ...(previous || {}),
            id: previous ? previous.id : uid('port'),
            type: 'Schuko',
            label: `Steckdose ${outletNumber}`,
            side: 'right',
            speed: 'Standard',
            powerRole: 'outlet',
            outletNumber,
            amount: 1,
            cableId: previous ? previous.cableId : null,
          };
        });
        return [inputPort, ...outlets];
      }

      function buildDevicePorts(device, deviceType) {
        if (deviceType === 'Steckdose') return buildSocketPorts(device, 1).slice(1);
        if (deviceType === 'Steckdosenleiste') {
          const outletCount = clamp(Math.floor(Number(ui.outletCountInput.value) || 1), 1, 20);
          ui.outletCountInput.value = outletCount;
          return buildSocketPorts(device, outletCount);
        }
        return buildPortListFromForm(device);
      }

      function hasRemovedConnectedPorts(existing, nextPorts) {
        if (!existing) return false;
        const nextPortIds = new Set(nextPorts.map((port) => port.id));
        return existing.ports.some((port) => port.cableId && !nextPortIds.has(port.id));
      }

      function saveDeviceFromForm(event) {
        event.preventDefault();
        if (!ui.deviceName.value.trim()) {
          showToast(t('deviceNameRequired'));
          return;
        }

        const deviceInput = {
          id: state.openDeviceId || uid('device'),
          name: ui.deviceName.value.trim(),
          description: ui.deviceDescription.value.trim(),
          storage: Number(ui.deviceStorageValue.value || 0),
          storageUnit: ui.deviceStorageUnit.value,
          cpuModel: ui.cpuModel.value.trim(),
          ramGb: Number(ui.ramGb.value || 0),
          ramType: ui.ramType.value,
          gpuModel: ui.gpuModel.value.trim(),
          raspberryPiVersion: ui.raspberryPiVersion.value,
          powerWatt: Number(ui.devicePowerWatt.value || 0),
          type: ui.deviceType.value,
          w: 190,
          h: ui.deviceType.value === 'Steckdosenleiste'
            ? Math.max(150, 110 + clamp(Math.floor(Number(ui.outletCountInput.value) || 1), 1, 20) * 25)
            : (ui.deviceType.value === 'Steckdose' ? 160 : 135),
          ports: []
        };

        const existing = state.devices.get(deviceInput.id);
        deviceInput.ports = buildDevicePorts(existing, deviceInput.type);
        if (!hasPowerInput(deviceInput.ports, deviceInput.powerWatt)) {
          showToast(t('missingPowerPort'));
          return;
        }
        if (existing && hasRemovedConnectedPorts(existing, deviceInput.ports)) {
          showToast(t('removeOutletCableFirst'));
          return;
        }
        if (existing) {
          deviceInput.x = existing.x;
          deviceInput.y = existing.y;
          state.devices.set(deviceInput.id, { ...existing, ...deviceInput });
        } else {
          const pos = randomPosition(deviceInput.w, deviceInput.h);
          deviceInput.x = pos.x;
          deviceInput.y = pos.y;
          state.enteringDeviceId = deviceInput.id;
          state.devices.set(deviceInput.id, deviceInput);
        }

        saveState();
        render();
        state.enteringDeviceId = null;
        closeDeviceModal();
        showToast(t('saved'));
      }

      function deleteSelectedDevice() {
        const selectedId = state.selectedDeviceId;
        if (!selectedId) {
          showToast(t('noDeviceSelected'));
          return;
        }
        const device = state.devices.get(selectedId);
        if (!device) return;
        const relatedCableIds = [...state.cables.keys()].filter((cableId) => {
          const cable = state.cables.get(cableId);
          return cable && (cable.fromDeviceId === device.id || cable.toDeviceId === device.id);
        });
        relatedCableIds.forEach((cableId) => state.cables.delete(cableId));
        state.devices.delete(selectedId);
        if (state.hoveredDeviceId === selectedId) state.hoveredDeviceId = null;
        state.selectedDeviceId = null;
        state.selectedCableId = null;
        saveState();
        render();
      }

      function deleteSelectedCable() {
        const cableId = state.selectedCableId;
        if (!cableId) return;
        state.cables.delete(cableId);
        state.devices.forEach((device) => {
          device.ports.forEach((port) => {
            if (port.cableId === cableId) port.cableId = null;
          });
        });
        state.selectedCableId = null;
        saveState();
        render();
      }

          item.addEventListener('click', () => {
            state.selectedDeviceId = device.id;
            openDeviceModal(device.id);
            renderDeviceList();

          ui.deviceList.appendChild(item);
        });
      }

      }

      // Draw the devices and refresh their ports after each state change.
      function renderDevices() {
        ui.deviceLayer.innerHTML = '';
        state.devices.forEach((device) => {
          const node = document.createElement('div');
          node.className = 'device' + (state.selectedDeviceId === device.id ? ' selected' : '');
          node.style.width = Math.max(170, Math.min(330, 150 + (device.ports || []).length * 5)) + 'px';
          if (state.enteringDeviceId === device.id) node.classList.add('device-entering');
          node.style.left = `${device.x}px`;
          node.style.top = `${device.y}px`;
          node.style.width = `${device.w}px`;
          node.style.height = `${device.h}px`;
          node.dataset.deviceId = device.id;

          node.addEventListener('mouseenter', () => {
            state.hoveredDeviceId = device.id;
          });
          node.addEventListener('mouseleave', () => {
            if (state.hoveredDeviceId === device.id) state.hoveredDeviceId = null;
          });

          const header = document.createElement('div');
          header.className = 'device-header';
          const name = document.createElement('div');
          name.className = 'device-name';
          name.textContent = device.name || 'Gerät';
          const chip = document.createElement('span');
          chip.className = 'small-button';
          chip.textContent = getDeviceTypeLabel(device.type);
          header.appendChild(name);
          header.appendChild(chip);

          const body = document.createElement('div');
          body.className = 'device-body';
          const model = document.createElement('div');
          model.className = 'device-model';
          model.innerHTML = getDeviceModelSvg(device.type);
          const copy = document.createElement('div');
          copy.className = 'device-copy';
          const description = document.createElement('div');
          description.className = 'device-description';
          description.textContent = device.description || '—';
          const power = document.createElement('div');
          power.className = 'device-power';
          power.textContent = `${Number(device.powerWatt || 0)} W`;
          copy.appendChild(description);
          copy.appendChild(power);
          body.appendChild(model);
          body.appendChild(copy);
          const outletPorts = device.ports.filter((port) => port.powerRole === 'outlet');
          const outletMeterRows = outletPorts.map((port) => `
            <div class="outlet-meter-row">
              <span>${getPortDisplayLabel(port.label)}</span>
              <strong>${calculateOutletLoad(device, port)} W</strong>
            </div>
          `).join('');
          if (outletMeterRows) {
            const meterList = document.createElement('div');
            meterList.className = 'outlet-meter-list';
            meterList.innerHTML = outletMeterRows;
            body.appendChild(meterList);
          }

          node.appendChild(header);
          node.appendChild(body);

          const portsBySide = { left: [], right: [], top: [], bottom: [] };
          device.ports.forEach((port) => {
            const side = port.side || 'right';
            if (portsBySide[side]) portsBySide[side].push(port);
          });

          Object.entries(portsBySide).forEach(([side, list]) => {
            list.forEach((port, index) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'port' + (port.cableId ? ' used' : '');
              btn.dataset.deviceId = device.id;
              btn.dataset.portId = port.id;
              btn.dataset.side = side;
              btn.textContent = port.outletNumber ? `S${port.outletNumber}` : getPortShortLabel(port.type, port.speed || port.label);
              if (port.powerRole === 'outlet') btn.title = `${getPortDisplayLabel(port.label)}: ${calculateOutletLoad(device, port)} W`;

              let x = 0;
              let y = 0;
              const total = Math.max(list.length, 1);
              const ratio = (index + 1) / (total + 1);
              if (side === 'left') {
                x = 0;
                y = (device.h * ratio);
              } else if (side === 'right') {
                x = device.w;
                y = (device.h * ratio);
              } else if (side === 'top') {
                x = (device.w * ratio);
                y = 0;
              } else {
                x = (device.w * ratio);
                y = device.h;
              }
              btn.style.left = `${x}px`;
              btn.style.top = `${y}px`;

              btn.addEventListener('click', (event) => {
                event.stopPropagation();
                handlePortClick(device.id, port.id);
              });

              node.appendChild(btn);
            });
          });

          node.addEventListener('mousedown', (event) => {
            if (event.target.closest('.port')) return;
            state.selectedDeviceId = device.id;
            state.selectedCableId = null;
            startDragging(event, device.id);
          });

          node.addEventListener('click', () => {
            state.selectedDeviceId = device.id;
            openDeviceModal(device.id);
            renderDeviceList();
          });

          ui.deviceLayer.appendChild(node);
        });
      }

      function pathBetweenPorts(from, to) {
        const dx = Math.max(90, Math.abs(to.x - from.x) * 0.75);
        const cx1 = from.x + dx;
        const cy1 = from.y;
        const cx2 = to.x - dx;
        const cy2 = to.y;
        return `M ${from.x} ${from.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${to.x} ${to.y}`;
      }

      function getPortWorldPosition(device, port) {
        const portsBySide = { left: [], right: [], top: [], bottom: [] };
        device.ports.forEach((candidate) => {
          const side = candidate.side || 'right';
          if (portsBySide[side]) portsBySide[side].push(candidate);
        });
        const list = portsBySide[port.side] || [];
        const index = list.findIndex((candidate) => candidate.id === port.id);
        const total = Math.max(list.length, 1);
        const ratio = (index + 1) / (total + 1);

        let x = 0;
        let y = 0;

        if (port.side === 'left') {
          x = device.x;
          y = device.y + device.h * ratio;
        } else if (port.side === 'right') {
          x = device.x + device.w;
          y = device.y + device.h * ratio;
        } else if (port.side === 'top') {
          x = device.x + device.w * ratio;
          y = device.y;
        } else {
          x = device.x + device.w * ratio;
          y = device.y + device.h;
        }

        return { x, y };
      }

      function renderCables() {
        ui.cableLayer.innerHTML = '';
        state.cables.forEach((cable) => {
          const fromDevice = getDeviceById(cable.fromDeviceId);
          const toDevice = getDeviceById(cable.toDeviceId);
          const fromPort = fromDevice ? getPortById(cable.fromDeviceId, cable.fromPortId) : null;
          const toPort = toDevice ? getPortById(cable.toDeviceId, cable.toPortId) : null;
          if (!fromDevice || !toDevice || !fromPort || !toPort) return;

          const start = getPortWorldPosition(fromDevice, fromPort);
          const end = getPortWorldPosition(toDevice, toPort);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathBetweenPorts(start, end));
          path.setAttribute('stroke', cable.color || getCableColor(cable.type));
          path.setAttribute('stroke-width', state.selectedCableId === cable.id ? '6' : '4');
          path.setAttribute('fill', 'none');
          path.setAttribute('class', 'cable-path' + (state.selectedCableId === cable.id ? ' selected' : ''));
          path.setAttribute('aria-label', getCableTypeLabel(cable.type));
          const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          title.textContent = getCableTypeLabel(cable.type);
          path.appendChild(title);
          path.style.pointerEvents = 'auto';
          path.addEventListener('pointermove', (event) => {
            const tooltip = ui.cableTooltip;
            tooltip.textContent = getCableTypeLabel(cable.type);
            tooltip.classList.add('visible');
            tooltip.setAttribute('aria-hidden', 'false');
            tooltip.style.left = `${Math.max(8, Math.min(event.clientX + 14, window.innerWidth - tooltip.offsetWidth - 8))}px`;
            tooltip.style.top = `${Math.max(8, Math.min(event.clientY + 14, window.innerHeight - tooltip.offsetHeight - 8))}px`;
          });
          path.addEventListener('pointerleave', () => {
            ui.cableTooltip.classList.remove('visible');
            ui.cableTooltip.setAttribute('aria-hidden', 'true');
          });
          path.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            state.selectedCableId = cable.id;
            ui.cableColorPicker.value = cable.color || getCableColor(cable.type);
            if (typeof ui.cableColorPicker.showPicker === 'function') ui.cableColorPicker.showPicker();
            else ui.cableColorPicker.click();
          });
          path.addEventListener('click', (event) => {
            event.stopPropagation();
            state.selectedCableId = cable.id;
            state.selectedDeviceId = null;
            render();
          });
          ui.cableLayer.appendChild(path);
        });
      }

      function handlePortClick(deviceId, portId) {
        const device = getDeviceById(deviceId);
        const port = getPortById(deviceId, portId);
        if (!device || !port) return;

        if (!state.selectedPort) {
          if (port.cableId) {
            showToast(t('occupiedPort'));
            return;
          }
          const compatibleCableTypes = getCompatibleCableTypes(port.type)
            .filter((type) => isCableCompatible(port, type, device));
          if (!compatibleCableTypes.includes(state.selectedCableType)) {
            state.selectedCableType = compatibleCableTypes[0] || 'Sonstiges';
            ui.cableTypeSelect.value = state.selectedCableType;
            saveState();
          }
          state.selectedPort = { deviceId, portId };
          const portNode = document.querySelector(`.port[data-device-id="${deviceId}"][data-port-id="${portId}"]`);
          if (portNode) portNode.classList.add('active');
          return;
        }

        const currentA = state.selectedPort;
        const deviceA = getDeviceById(currentA.deviceId);
        const portA = getPortById(currentA.deviceId, currentA.portId);
        const portB = port;

        if (portA && portB && portA.powerRole === 'outlet' && portB.powerRole === 'outlet') {
          showToast(t('incompatibleCable'));
          state.selectedPort = null;
          render();
          return;
        }

        if (currentA.deviceId === deviceId && currentA.portId === portId) {
          showToast(t('selfConnectionBlocked'));
          state.selectedPort = null;
          render();
          return;
        }

        const commonCableTypes = portA && portB
          ? getCompatibleCableTypes(portA.type).filter((type) => {
            return getCompatibleCableTypes(portB.type).includes(type)
              && isCableCompatible(portA, type, deviceA)
              && isCableCompatible(portB, type, device);
          })
          : [];
        const cableType = commonCableTypes.includes(state.selectedCableType)
          ? state.selectedCableType
          : commonCableTypes[0];
        if (!cableType) {
          showToast(t('incompatibleCable'));
          state.selectedPort = null;
          render();
          return;
        }

        if (portA && portB && (portA.cableId || portB.cableId)) {
          showToast(t('occupiedPort'));
          state.selectedPort = null;
          render();
          return;
        }

        const cableId = uid('cable');
        const cable = {
          id: cableId,
          type: cableType,
          color: getCableColor(cableType),
          fromDeviceId: currentA.deviceId,
          fromPortId: currentA.portId,
          toDeviceId: deviceId,
          toPortId: portId,
        };

        state.cables.set(cableId, cable);
        portA.cableId = cableId;
        portB.cableId = cableId;
        state.selectedCableType = cableType;
        state.selectedPort = null;
        saveState();
        render();
      }


      function getPortTypeLabel(portType) {
        const labels = state.lang === 'en' ? {
          'Klinke 3,5 mm': '3.5 mm audio jack',
          'Klinke 6,3 mm': '6.3 mm audio jack',
          'Cinch': 'RCA',
          'Schuko': 'Schuko connector',
          'dc-in': 'DC input',
          'Serial': 'Serial port',
          'Parallel': 'Parallel port',
          'micro SD': 'microSD',
          'CF': 'CompactFlash',
          'Sonstiges': 'Other'
        } : {
          'Serial': 'Seriell',
          'dc-in': 'DC-Eingang',
          'micro SD': 'microSD',
          'CF': 'CompactFlash'
        };
        return labels[portType] || portType;
      }

      function getPortSideLabel(side) {
        if (state.lang === 'en') return ({ left: 'left', right: 'right', top: 'top', bottom: 'bottom' })[side] || side;
        return ({ left: 'links', right: 'rechts', top: 'oben', bottom: 'unten' })[side] || side;
      }

      function getPortSpeedLabel(speed) {
        return state.lang === 'en' && speed === 'Standard' ? 'Default' : speed;
      }

      function getCableTypeLabel(type) {
        const germanLabels = {
          Fiber: 'Glasfaser / Fiber',
          DAC: 'DAC (Direct Attach Copper)',
          Cat6: 'Cat6'
        };
        if (state.lang !== 'en') return germanLabels[type] || type;
        const labels = {
          'Strom': 'Power',
          'Stromkabel': 'Power cable',
          Fiber: 'Fiber optic',
          DAC: 'DAC (Direct Attach Copper)',
          Cat6: 'Cat6',
          'Sonstiges': 'Other'
        };
        return labels[type] || type;
      }

      function getPortDisplayLabel(label) {
        if (state.lang !== 'en' || !label) return label || '';
        if (label === 'Stromanschluss') return 'Power input';
        if (label === 'Einspeisung IEC C20') return 'IEC C20 power input';
        let match = label.match(/^Steckdose (\d+)$/);
        if (match) return `Power outlet ${match[1]}`;
        match = label.match(/^IEC C13 Ausgang (\d+)$/);
        if (match) return `IEC C13 output ${match[1]}`;
        return label;
      }

<script>
(function () {
  const root = document.querySelector('.canvas-shell');
  const content = document.querySelector('.canvas-content');

  // Drag an empty part of the canvas to move around a large plan.
  if (root && content) {
    let pan = false;
    let startX = 0;
    let startY = 0;
    let originX = 0;
    let originY = 0;

    root.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.device, button, input, select, textarea, .cable-path')) return;

      pan = true;
      startX = event.clientX;
      startY = event.clientY;

      const transform = new DOMMatrix(getComputedStyle(content).transform);
      originX = transform.m41;
      originY = transform.m42;
      root.setPointerCapture?.(event.pointerId);
      root.style.cursor = 'grabbing';
    });

    root.addEventListener('pointermove', (event) => {
      if (!pan) return;

      const x = originX + event.clientX - startX;
      const y = originY + event.clientY - startY;
      content.style.transform = `translate(${x}px, ${y}px)`;
    });

    const stop = () => {
      pan = false;
      root.style.cursor = '';
    };

    root.addEventListener('pointerup', stop);
    root.addEventListener('pointercancel', stop);
    content.style.transformOrigin = '0 0';
  }

  // Add a small search box above the device-type list.
  const deviceType = document.querySelector('#deviceType');
  if (deviceType && !document.querySelector('#deviceTypeSearch')) {
    const search = document.createElement('input');
    search.id = 'deviceTypeSearch';
    search.type = 'search';
    search.placeholder = 'Gerät suchen …';
    search.setAttribute('aria-label', 'Gerätetyp suchen');
    search.style.cssText = 'width:100%;box-sizing:border-box;margin:0 0 6px;padding:8px;border-radius:8px;';
    deviceType.parentElement.insertBefore(search, deviceType);

    search.addEventListener('input', () => {
      const query = search.value.toLocaleLowerCase();
      [...deviceType.options].forEach((option) => {
        option.hidden = !option.textContent.toLocaleLowerCase().includes(query);
      });
    });

    deviceType.addEventListener('change', () => {
      search.value = '';
      [...deviceType.options].forEach((option) => {
        option.hidden = false;
      });
    });
  }

  // Keep the workspace much larger than the visible window so it can be explored freely.
  const canvas = document.querySelector('.canvas');
  if (canvas) {
    canvas.style.width = '100000px';
    canvas.style.height = '100000px';
  }
})();

<script>
(function () {
  const plannerStorageKey = typeof STORAGE_KEY === 'string' ? STORAGE_KEY : '';
  if (!plannerStorageKey) return;
  const workspacesKey = `planner-workspaces:${plannerStorageKey}`;
  const root = document.querySelector('.canvas-shell');

  const readPlannerState = () => localStorage.getItem(plannerStorageKey) || '';
  const readWorkspaces = () => {
    try {
      const saved = JSON.parse(localStorage.getItem(workspacesKey) || 'null');
      if (saved && Array.isArray(saved.items) && saved.items.length) return saved;
    } catch (error) {

    }
    return null;
  };
  const initialSnapshot = readPlannerState();
  let manager = readWorkspaces();
  if (!manager) {
    manager = {
      activeId: 'workspace-1',
      nextId: 2,
      items: [{ id: 'workspace-1', name: 'Arbeitsfläche 1', snapshot: initialSnapshot }]
    };
    localStorage.setItem(workspacesKey, JSON.stringify(manager));
  }
  if (!manager.items.some((item) => item.id === manager.activeId)) manager.activeId = manager.items[0].id;

  const current = () => {
    return manager.items.find((item) => item.id === manager.activeId) || manager.items[0];
  };
  const saveManager = () => {
    localStorage.setItem(workspacesKey, JSON.stringify(manager));
  };
  let managerReady = true;
  const originalSetItem = Storage.prototype.setItem;
  Storage.prototype.setItem = function (key, value) {
    originalSetItem.call(this, key, value);
    if (managerReady && key === plannerStorageKey) {
      const active = current();
      if (active) active.snapshot = String(value);
      saveManager();
    }
  };

  const styles = document.createElement('style');
  styles.textContent = `
    .workspace-tabs {
      position: fixed;
      z-index: 120;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: calc(100% - 22px);
      overflow-x: auto;
      padding: 6px 7px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 5px 20px rgba(0,0,0,.14);
    }
    .workspace-tab, .workspace-add, .workspace-close {
      font: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--text);
      padding: 7px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .workspace-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .workspace-tab:hover, .workspace-add:hover, .workspace-close:hover {
      filter: brightness(.96);
    }
    .workspace-close {
      border: 0;
      background: transparent;
      padding: 0 0 0 8px;
      color: inherit;
    }
    .workspace-add {
      font-weight: 700;
      background: var(--panel);
    }
    :root[data-theme="dark"] .workspace-tabs {
      box-shadow: 0 6px 24px rgba(0,0,0,.4);
    }
  `;
  document.head.appendChild(styles);
  root.style.position = 'relative';
  const bar = document.createElement('div');
  bar.className = 'workspace-tabs';
  bar.setAttribute('role', 'tablist');
  bar.setAttribute('aria-label', 'Arbeitsflächen');
  root.appendChild(bar);
  const placeWorkspaceTabs = () => {
    const bounds = root.getBoundingClientRect();
    bar.style.left = `${bounds.left + bounds.width / 2}px`;
  };
  window.addEventListener('resize', placeWorkspaceTabs);
  placeWorkspaceTabs();

  function makeEmptySnapshot() {
    let data;
    try {
      data = JSON.parse(readPlannerState() || '{}');
    } catch (_) {
      data = {};
    }
    data.devices = [];
    data.cables = [];
    data.nextCounter = 1;
    data.zoom = 1;
    if ('selectedCableType' in data) data.selectedCableType = 'LAN';
    return JSON.stringify(data);
  }

  function resetTransientSelection() {
    try {
      if (typeof state !== 'undefined') {
        state.selectedDeviceId = null;
        state.selectedCableId = null;
        state.selectedPort = null;
        state.hoveredDeviceId = null;
        state.openDeviceId = null;
      }
    } catch (_) {}
    const modal = document.getElementById('deviceModal');
    if (modal) modal.classList.add('hidden');
  }

  function restoreWorkspace(workspace) {
    if (!workspace) return;
    manager.activeId = workspace.id;
    const snapshot = workspace.snapshot || makeEmptySnapshot();
    managerReady = false;
    localStorage.setItem(plannerStorageKey, snapshot);
    managerReady = true;
    workspace.snapshot = snapshot;
    try {
      if (typeof loadState === 'function') loadState();
      resetTransientSelection();
      if (typeof render === 'function') render();
    } catch (error) {
      console.error('Arbeitsfläche konnte nicht geöffnet werden.', error);
    }
    saveManager();
    renderWorkspaceTabs();
    try {
      reportTheme();
    } catch (_) {}
  }

  function activateWorkspace(id) {
    if (id === manager.activeId) return;
    try {
      if (typeof saveState === 'function') saveState();
    } catch (_) {}
    const oldActive = current();
    if (oldActive) oldActive.snapshot = readPlannerState();
    const next = manager.items.find((item) => item.id === id);
    if (!next) return;
    restoreWorkspace(next);
  }

  function createWorkspace() {
    try {
      if (typeof saveState === 'function') saveState();
    } catch (_) {}
    const active = current();
    if (active) active.snapshot = readPlannerState();
    const idNumber = manager.nextId || (manager.items.length + 1);
    const workspace = {
      id: `workspace-${idNumber}`,
      name: `Arbeitsfläche ${idNumber}`,
      snapshot: makeEmptySnapshot()
    };
    manager.nextId = idNumber + 1;
    manager.items.push(workspace);
    restoreWorkspace(workspace);
  }

  function deleteWorkspace(id) {
    if (manager.items.length <= 1) return;
    const item = manager.items.find((entry) => entry.id === id);
    if (!item) return;
    if (!window.confirm(`„${item.name}“ wirklich löschen?`)) return;
    const wasActive = manager.activeId === id;
    try {
      if (wasActive && typeof saveState === 'function') saveState();
    } catch (_) {}
    const active = current();
    if (active) active.snapshot = readPlannerState();
    manager.items = manager.items.filter((entry) => entry.id !== id);
    if (wasActive) {
      const next = manager.items[0];
      restoreWorkspace(next);
    } else {
      saveManager();
      renderWorkspaceTabs();
    }
  }

  function renderWorkspaceTabs() {
    bar.replaceChildren();
    manager.items.forEach((item) => {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = `workspace-tab${item.id === manager.activeId ? ' active' : ''}`;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', String(item.id === manager.activeId));
      tab.title = item.name;
      tab.textContent = item.name;
      tab.addEventListener('click', () => activateWorkspace(item.id));
      if (manager.items.length > 1) {
        const close = document.createElement('span');
        close.className = 'workspace-close';
        close.textContent = '×';
        close.title = `${item.name} löschen`;
        close.setAttribute('role', 'button');
        close.setAttribute('aria-label', `${item.name} löschen`);
        close.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteWorkspace(item.id);
        });
        tab.appendChild(close);
      }
      bar.appendChild(tab);
    });
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'workspace-add';
    add.textContent = '+';
    add.title = 'Neue Arbeitsfläche';
    add.setAttribute('aria-label', 'Neue Arbeitsfläche hinzufügen');
    add.addEventListener('click', createWorkspace);
    bar.appendChild(add);
  }

  // Keep the selected theme in sync with the outer planner switcher.
  // Share light/dark mode changes with the outer ServerWizard/WireWizard switch.
  const reportTheme = () => {
    const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    try {
      window.parent.postMessage({ type: 'planner-theme-change', theme }, '*');
    } catch (_) {}
  };
  new MutationObserver(reportTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  reportTheme();


  // Signal-Trace: selecting either end of a connected cable highlights the full route.
  const signalTraceStyles = document.createElement('style');
  signalTraceStyles.textContent = `
    .cable-path.selected {
      stroke-width: 7 !important;
      filter: drop-shadow(0 0 4px rgba(34, 211, 238, .95)) drop-shadow(0 0 9px rgba(59, 130, 246, .85)) !important;
      opacity: 1 !important;
    }
    .port.trace-endpoint {
      z-index: 8 !important;
      background: #22d3ee !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 0 4px rgba(34, 211, 238, .35), 0 0 14px rgba(34, 211, 238, .95) !important;
      animation: wirewizard-trace-pulse .7s ease-in-out infinite alternate;
    }
    @keyframes wirewizard-trace-pulse {
      from { transform: translate(-50%, -50%) scale(1.08); }
      to { transform: translate(-50%, -50%) scale(1.24); }
    }
  `;
  document.head.appendChild(signalTraceStyles);

  const renderDevicesBeforeSignalTrace = renderDevices;
  renderDevices = function () {
    renderDevicesBeforeSignalTrace();
    const selectedCable = state.selectedCableId ? state.cables.get(state.selectedCableId) : null;
    if (!selectedCable) return;
    [
      { deviceId: selectedCable.fromDeviceId, portId: selectedCable.fromPortId },
      { deviceId: selectedCable.toDeviceId, portId: selectedCable.toPortId }
    ].forEach((endpoint) => {
      const portNode = document.querySelector(`.port[data-device-id="${endpoint.deviceId}"][data-port-id="${endpoint.portId}"]`);
      if (portNode) portNode.classList.add('trace-endpoint');
    });
  };

  const handlePortClickBeforeSignalTrace = handlePortClick;
  handlePortClick = function (deviceId, portId) {
    const device = getDeviceById(deviceId);
    const port = getPortById(deviceId, portId);
    if (port && port.cableId && state.cables.has(port.cableId)) {
      const cable = state.cables.get(port.cableId);
      const fromDevice = getDeviceById(cable.fromDeviceId);
      const toDevice = getDeviceById(cable.toDeviceId);
      const fromPort = fromDevice && getPortById(fromDevice.id, cable.fromPortId);
      const toPort = toDevice && getPortById(toDevice.id, cable.toPortId);
      state.selectedPort = null;
      state.selectedCableId = cable.id;
      state.selectedDeviceId = null;
      render();
      const fromLabel = `${fromDevice ? fromDevice.name : 'Gerät'} · ${fromPort ? (fromPort.label || fromPort.type) : 'Port'}`;
      const toLabel = `${toDevice ? toDevice.name : 'Gerät'} · ${toPort ? (toPort.label || toPort.type) : 'Port'}`;
      showToast((state.lang === 'en' ? 'Signal trace: ' : 'Signal-Trace: ') + fromLabel + ' → ' + toLabel);
      return;
    }
    if (state.selectedCableId) {
      state.selectedCableId = null;
      renderCables();
    }
    handlePortClickBeforeSignalTrace(deviceId, portId);
  };


  renderWorkspaceTabs();
})();
<\/script>
<script>
(function () {
  'use strict';

  // Cable colours are set by type, with the existing per-cable picker still taking priority.
  const cableTypeColorsStorageKey = 'wirewizard-cable-type-colors-v1';
  const cableTypeColors = (() => {
    try {
      const stored = JSON.parse(localStorage.getItem(cableTypeColorsStorageKey) || '{}');
      return stored && typeof stored === 'object' && !Array.isArray(stored) ? stored : {};
    } catch (_) {
      return {};
    }
  })();
  window.__wireWizardCableTypeColors = cableTypeColors;

  const cableTypeColorStyle = document.createElement('style');
  cableTypeColorStyle.textContent = `
    .cable-type-colors-panel { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); }
    .cable-type-colors-panel > summary { padding: 9px 10px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); }
    .cable-type-colors-list { display: grid; gap: 6px; max-height: 260px; overflow: auto; padding: 0 9px 9px; }
    .cable-type-color-row { display: grid; grid-template-columns: minmax(0,1fr) 35px auto; gap: 6px; align-items: center; font-size: 12px; }
    .cable-type-color-row span { overflow-wrap: anywhere; }
    .cable-type-color-row input[type="color"] { width: 35px; height: 27px; padding: 2px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); cursor: pointer; }
    .cable-type-color-reset { border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); padding: 4px 5px; font-size: 10px; cursor: pointer; }
    .cable-type-color-reset:hover { background: var(--panel-soft); }
  `;
  document.head.appendChild(cableTypeColorStyle);

  const colorPanel = document.createElement('details');
  colorPanel.className = 'cable-type-colors-panel';
  colorPanel.innerHTML = '<summary id="cableTypeColorsSummary">Kabelfarben nach Typ</summary><div class="cable-type-colors-list" id="cableTypeColorsList"></div>';
  const cableTypeSection = document.getElementById('cableTypeSelect')?.closest('.sidebar-section');
  if (cableTypeSection) cableTypeSection.insertAdjacentElement('afterend', colorPanel);

  function defaultCableColor(type) {
    return cableColors[type] || cableColors.Sonstiges || '#7c8aa5';
  }

  function saveCableTypeColors() {
    try { localStorage.setItem(cableTypeColorsStorageKey, JSON.stringify(cableTypeColors)); } catch (_) {}
  }

  function applyCableTypeColor(type, color) {
    state.cables.forEach((cable) => {
      if (cable.type !== type || cable.colorSource === 'custom') return;
      cable.color = color;
      cable.colorSource = 'type';
    });
    saveState();
    render();
  }

  function renderCableTypeColorRows() {
    const list = document.getElementById('cableTypeColorsList');
    if (!list) return;
    list.replaceChildren();
    [...new Set(cableTypes)].forEach((type) => {
      const row = document.createElement('label');
      row.className = 'cable-type-color-row';
      const name = document.createElement('span');
      name.textContent = getCableTypeLabel(type);
      const input = document.createElement('input');
      input.type = 'color';
      input.value = cableTypeColors[type] || defaultCableColor(type);
      input.setAttribute('aria-label', (state.lang === 'en' ? 'Cable colour: ' : 'Kabelfarbe: ') + getCableTypeLabel(type));
      input.title = (state.lang === 'en' ? 'Set default colour for ' : 'Standardfarbe für ') + getCableTypeLabel(type);
      input.addEventListener('change', () => {
        cableTypeColors[type] = input.value;
        window.__wireWizardCableTypeColors = cableTypeColors;
        saveCableTypeColors();
        applyCableTypeColor(type, input.value);
      });

      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'cable-type-color-reset';
      reset.textContent = state.lang === 'en' ? 'Default' : 'Standard';
      reset.title = state.lang === 'en' ? 'Restore the standard colour' : 'Standardfarbe wiederherstellen';
      reset.addEventListener('click', () => {
        delete cableTypeColors[type];
        window.__wireWizardCableTypeColors = cableTypeColors;
        saveCableTypeColors();
        applyCableTypeColor(type, defaultCableColor(type));
        renderCableTypeColorRows();
      });
      row.append(name, input, reset);
      list.appendChild(row);
    });
  }

  const baseGetCableColor = getCableColor;
  getCableColor = function (type) {
    return cableTypeColors[type] || baseGetCableColor(type);
  };

  const updateCableColorPanelLanguage = () => {
    const summary = document.getElementById('cableTypeColorsSummary');
    if (summary) summary.textContent = state.lang === 'en' ? 'Cable colours by type' : 'Kabelfarben nach Typ';
    renderCableTypeColorRows();
  };
  document.querySelectorAll('[data-lang]').forEach((button) => {
    button.addEventListener('click', () => setTimeout(updateCableColorPanelLanguage, 0));
  });
  window.addEventListener('storage', (event) => {
    if (event.key !== cableTypeColorsStorageKey) return;
    try {
      const stored = JSON.parse(event.newValue || '{}');
      Object.keys(cableTypeColors).forEach((key) => delete cableTypeColors[key]);
      Object.assign(cableTypeColors, stored && typeof stored === 'object' ? stored : {});
      window.__wireWizardCableTypeColors = cableTypeColors;
      renderCableTypeColorRows();
      state.cables.forEach((cable) => {
        if (cable.colorSource === 'custom') return;
        cable.color = cableTypeColors[cable.type] || defaultCableColor(cable.type);
      });
      saveState();
      render();
    } catch (_) {}
  });

  renderCableTypeColorRows();
})();
<\/script>

  <script>
    // Get the readable planner source and restore its escaped closing script tags.
    function getPlannerSource(sourceId) {
      const source = document.getElementById(sourceId).textContent;
      const closingScriptTag = "</scr" + "ipt>";
      return source.replaceAll("<\\/script>", closingScriptTag);
    }

    const serverView = document.getElementById("server-view");
    const cableView = document.getElementById("cable-view");
    const serverButton = document.getElementById("show-server");
    const cableButton = document.getElementById("show-cable");
    const modeSwitch = document.querySelector(".mode-switch");
    let currentLanguage = "de";

    function updateModeSwitchLanguage() {
      const english = currentLanguage === "en";
      document.documentElement.lang = currentLanguage;
      const serverModeName = "ServerWizard";
      const cableModeName = "WireWizard";
      const serverName = english ? "Server planner" : "Serverplaner";
      const cableName = english ? "Cable planner" : "Kabelplaner";
      const showingServer = !serverView.hidden;

      document.title = showingServer ? serverModeName : cableModeName;
      document.getElementById("app-name").textContent = showingServer ? serverModeName : cableModeName;
      modeSwitch.setAttribute("aria-label", english ? "Choose mode" : "Modus auswählen");
      serverButton.textContent = serverModeName;
      cableButton.textContent = cableModeName;
      document.getElementById("project-tag").title = english ? "Project by Benninator111" : "Projekt von Benninator111";
      serverView.title = `${serverModeName} – ${serverName}`;
      cableView.title = `${cableModeName} – ${cableName}`;
    }

    function syncPlannerLanguage(lang) {
      if (!['de', 'en'].includes(lang)) return;
      currentLanguage = lang;
      updateModeSwitchLanguage();
      [serverView, cableView].forEach((frame) => {
        try {
          if (frame.contentWindow) frame.contentWindow.postMessage({ type: "planner-set-language", lang }, "*");
        } catch (_) {}
      });
    }

    function syncActivePlannerTheme() {
      const activeFrame = serverView.hidden ? cableView : serverView;
      try {
        const theme = activeFrame.contentDocument.documentElement.dataset.theme;
        document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
      } catch (_) {}
    }

    function showView(which) {
      const showServer = which === "server";
      serverView.hidden = !showServer;
      cableView.hidden = showServer;
      serverButton.classList.toggle("active", showServer);
      cableButton.classList.toggle("active", !showServer);
      serverButton.setAttribute("aria-pressed", String(showServer));
      cableButton.setAttribute("aria-pressed", String(!showServer));
      updateModeSwitchLanguage();
      syncActivePlannerTheme();
    }

    serverView.addEventListener("load", () => {
      if (serverView.contentWindow) serverView.contentWindow.postMessage({ type: "planner-set-language", lang: currentLanguage }, "*");
      syncActivePlannerTheme();
    });
    cableView.addEventListener("load", () => {
      if (cableView.contentWindow) cableView.contentWindow.postMessage({ type: "planner-set-language", lang: currentLanguage }, "*");
      syncActivePlannerTheme();
    });
    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message && message.type === "planner-language-change") syncPlannerLanguage(message.lang);
      const activeFrame = serverView.hidden ? cableView : serverView;
      if (message && message.type === "planner-theme-change" && ["light", "dark"].includes(message.theme) && event.source === activeFrame.contentWindow) {
        document.documentElement.dataset.theme = message.theme;
      }
    });

    serverView.srcdoc = getPlannerSource("server-html-source");
    cableView.srcdoc = getPlannerSource("cable-html-source");
    updateModeSwitchLanguage();
    document.documentElement.dataset.theme = "light";
    serverButton.addEventListener("click", () => showView("server"));
    cableButton.addEventListener("click", () => showView("cable"));
  </script>
