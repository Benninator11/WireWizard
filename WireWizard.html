<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Benninator111">
  <title>ServerWizard</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb;
    }

    :root {
      color-scheme: light;
      --switch-bg: #f8fbff;
      --switch-border: #dfe7f6;
      --switch-text: #1d2a39;
      --switch-button-bg: #ffffff;
      --switch-muted: #607086;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --switch-bg: #1c242d;
      --switch-border: #394552;
      --switch-text: #edf2f8;
      --switch-button-bg: #27313c;
      --switch-muted: #b5c1cf;
    }

    /* The mode switch stays outside the two planner documents. */
    .mode-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      flex: 0 0 auto;
      background: var(--switch-bg);
      border-bottom: 1px solid var(--switch-border);
      color: var(--switch-text);
    }

    .mode-switch button {
      border: 1px solid var(--switch-border);
      background: var(--switch-button-bg);
      color: var(--switch-text);
      border-radius: 8px;
      padding: 7px 13px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .mode-switch button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 14px rgba(25, 40, 75, 0.08);
    }

    .mode-switch button.active {
      color: #fff;
      background: #2f6fed;
      border-color: #2f6fed;
    }

    .mode-switch button:focus-visible {
      outline: 3px solid rgba(47, 111, 237, 0.28);
      outline-offset: 2px;
    }

    .app-name {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0.2px;
      color: var(--switch-text);
      white-space: nowrap;
      padding: 0 5px 0 2px;
    }

    .project-tag {
      margin-left: auto;
      color: var(--switch-muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .view-frame {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: transparent;
    }

    .view-frame[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <nav class="mode-switch" aria-label="Modus auswählen">
    <strong class="app-name" id="app-name">ServerWizard</strong>
    <button type="button" id="show-server" class="active" aria-pressed="true">ServerWizard</button>
    <button type="button" id="show-cable" aria-pressed="false">WireWizard</button>
    <span class="project-tag" id="project-tag" title="Projekt von Benninator111">Benninator111</span>
  </nav>
  <iframe id="server-view" class="view-frame" title="ServerWizard – Serverplaner"></iframe>
  <iframe id="cable-view" class="view-frame" title="WireWizard – Kabelplaner" hidden></iframe>

  <!-- Both planner documents are kept below as readable source. Their closing </script> tags are escaped
       inside the text blocks and restored by getPlannerSource() before each iframe is loaded. -->
  <script type="text/plain" id="server-html-source"><!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ServerWizard</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef3ff;
        --border: #dfe7f6;
        --text: #1d2a39;
        --muted: #607086;
        --primary: #2f6fed;
        --primary-soft: rgba(47, 111, 237, 0.12);
        --danger: #d94a4a;
        --danger-soft: rgba(217, 74, 74, 0.12);
        --success: #2da66a;
        --warning: #ffb703;
        --shadow: 0 12px 28px rgba(25, 40, 75, 0.12);
        --device-w: 190px;
        --device-h: 135px;
      }

      :root[data-theme="dark"] {
        --bg: #171d24;
        --panel: #222b35;
        --panel-soft: #2a3744;
        --border: #3a4857;
        --text: #e7edf3;
        --muted: #a7b5c3;
        --primary: #77a7ff;
        --primary-soft: rgba(119, 167, 255, 0.18);
        --danger: #e36b6b;
        --danger-soft: rgba(227, 107, 107, 0.18);
        --success: #50c68a;
        --warning: #f4bd4f;
        --shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      button, input, select, textarea {
        font: inherit;
      }

      .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 10px 16px;
        background: #f8fbff;
        border-bottom: 1px solid var(--border);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        animation: ui-enter 0.32s ease-out both;
      }

      @keyframes ui-enter {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      :root[data-theme="dark"] .topbar,
      :root[data-theme="dark"] .sidebar {
        background: #1d252e;
      }

      .topbar-left,
      .topbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .pill,
      .button,
      .small-button {
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        border-radius: 8px;
        cursor: pointer;
        transition: 0.18s ease;
      }

      .button {
        padding: 9px 14px;
        font-weight: 600;
      }

      .small-button {
        padding: 6px 10px;
        font-size: 12px;
      }

      .button:hover,
      .small-button:hover,
      .pill:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 14px rgba(25, 40, 75, 0.08);
      }

      .button:active,
      .small-button:active,
      .pill:active {
        transform: translateY(0) scale(0.98);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(47, 111, 237, 0.28);
        outline-offset: 2px;
      }

      .button.primary {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .button.danger {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
      }

      .button.warning {
        background: var(--warning);
        color: #1e1e1e;
        border-color: var(--warning);
      }

      .lang-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }

      .lang-toggle button {
        background: transparent;
        border: none;
        padding: 6px 12px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 700;
      }

      .lang-toggle button.active {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .power-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: ui-enter 0.36s 0.06s ease-out both;
      }

      .power-bar {
        position: relative;
        width: 100%;
        height: 18px;
        border-radius: 999px;
        background: #eceff8;
        border: 1px solid var(--border);
        overflow: hidden;
      }

      :root[data-theme="dark"] .power-bar {
        background: #303b47;
      }

      .power-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #42b36d, #72d98c);
        transition: width 0.2s ease;
      }

      .power-wrap.warning .power-fill {
        background: linear-gradient(90deg, #ef7a4d, #d94a4a);
      }

      .power-label {
        white-space: nowrap;
        font-size: 13px;
        font-weight: 700;
      }

      .zoom-controls {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      .zoom-controls button {
        width: 34px;
        height: 34px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
      }

      .zoom-level {
        min-width: 48px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .sidebar {
        width: 300px;
        background: #f9fbff;
        border-right: 1px solid var(--border);
        padding: 16px;
        overflow: auto;
      }

      .sidebar-section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 14px;
        box-shadow: 0 6px 18px rgba(18, 33, 60, 0.04);
        animation: ui-enter 0.32s ease-out both;
      }

      .sidebar-section:nth-child(2) {
        animation-delay: 0.05s;
      }

      .sidebar-section:nth-child(3) {
        animation-delay: 0.1s;
      }

      .sidebar h3 {
        margin: 0 0 12px 0;
        font-size: 15px;
      }

      .device-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .device-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #f7f9fd;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        transition: 0.16s ease;
      }

      :root[data-theme="dark"] .device-item,
      :root[data-theme="dark"] .port-check {
        background: #27313c;
      }

      .device-item:hover,
      .device-item.selected {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .device-meta {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .device-type {
        font-size: 11px;
        color: var(--muted);
      }

      .canvas-shell {
        flex: 1;
        padding: 16px;
        overflow: auto;
        background: linear-gradient(180deg, #f6f8fe 0%, #edf2fb 100%);
      }

      :root[data-theme="dark"] .canvas-shell {
        background: linear-gradient(180deg, #1c242d 0%, #171d24 100%);
      }

      .canvas {
        position: relative;
        width: 1600px;
        height: 900px;
        background-color: #fff;
        background-image: radial-gradient(circle, rgba(71, 94, 128, 0.14) 1px, transparent 1.2px);
        background-size: 22px 22px;
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(3, 10, 26, 0.02);
      }

      .canvas-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1600px;
        height: 900px;
        transform-origin: top left;
      }

      :root[data-theme="dark"] .canvas {
        background-color: #202832;
        background-image: radial-gradient(circle, rgba(175, 196, 219, 0.16) 1px, transparent 1.2px);
        box-shadow: inset 0 0 0 1px rgba(220, 232, 245, 0.04);
      }

      :root[data-theme="dark"] .field input,
      :root[data-theme="dark"] .field select,
      :root[data-theme="dark"] .field textarea,
      :root[data-theme="dark"] .close-btn,
      :root[data-theme="dark"] .sidebar select,
      :root[data-theme="dark"] .port-check select,
      :root[data-theme="dark"] .port-check input,
      :root[data-theme="dark"] .port-check button {
        background: #27313c;
        color: var(--text);
      }

      :root[data-theme="dark"] .port.used {
        background: #344b69;
      }

      :root[data-theme="dark"] .lang-toggle {
        background: var(--panel);
      }

      .cable-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .cable-path {
        fill: none;
        stroke: #4f5d75;
        stroke-width: 4;
        stroke-linecap: round;
        opacity: 0.9;
        pointer-events: auto;
        cursor: pointer;
        transition: stroke-width 0.16s ease, opacity 0.16s ease, filter 0.16s ease;
      }

      .cable-path:hover {
        stroke-width: 6;
        opacity: 1;
        filter: drop-shadow(0 2px 2px rgba(29, 42, 57, 0.2));
      }

      .cable-path.selected {
        stroke-width: 6;
        stroke-dasharray: 10 8;
        animation: cable-flow 0.8s linear infinite;
      }

      .cable-tooltip {
        position: fixed;
        z-index: 70;
        max-width: min(240px, calc(100vw - 16px));
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: #17212b;
        color: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.24);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.08s ease;
      }

      .cable-tooltip.visible {
        opacity: 1;
      }

      .cable-tooltip:not(.visible) {
        visibility: hidden;
      }

      @keyframes cable-flow {
        to { stroke-dashoffset: -18; }
      }

      .device-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .device {
        position: absolute;
        pointer-events: auto;
        min-width: 170px;
        min-height: 120px;
        border-radius: 14px;
        border: 2px solid rgba(28, 35, 48, 0.22);
        background: var(--panel);
        box-shadow: var(--shadow);
        cursor: move;
        user-select: none;
        transition: border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .device-entering {
        animation: device-enter 0.3s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      @keyframes device-enter {
        from { opacity: 0; transform: translateY(7px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .device:hover {
        box-shadow: 0 14px 32px rgba(25, 40, 75, 0.18);
      }

      .device.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.18), var(--shadow);
      }

      .device-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px 4px;
        gap: 8px;
      }

      .device-name {
        font-weight: 700;
        font-size: 14px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .device-body {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: center;
        gap: 4px 8px;
        padding: 2px 10px 8px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.35;
      }

      .device-model {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 86px;
        height: 62px;
        padding: 4px;
        background: var(--panel-soft);
        border-radius: 7px;
      }

      .device-model-art {
        display: block;
        width: 100%;
        height: 100%;
        color: var(--text);
        overflow: visible;
        transform-box: fill-box;
        transform-origin: center;
        animation: device-icon-idle 3.4s ease-in-out infinite, device-icon-float 4.8s ease-in-out infinite;
      }

      /* Device illustrations and their small visual details. */
      .device-model-art .status-light {
        filter: drop-shadow(0 0 1.2px rgba(57, 169, 120, 0.7));
      }

      .device-model-art .screen-line,
      .device-model-art .signal-wave {
        filter: drop-shadow(0 0 1px rgba(78, 157, 208, 0.45));
      }

      @keyframes device-icon-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-0.8px) scale(1.006); }
      }

      @keyframes device-icon-idle {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(47, 111, 237, 0)); }
        50% { filter: drop-shadow(0 2px 3px rgba(47, 111, 237, 0.2)); }
      }

      .device-model-art .status-light {
        animation: status-blink 1.1s steps(2, end) infinite;
      }

      @keyframes status-blink {
        50% { opacity: 0.2; }
      }

      .device-model-art--router .signal-wave {
        transform-box: fill-box;
        transform-origin: center;
        animation: signal-pulse 1.8s ease-out infinite;
      }

      .device-model-art--router .signal-wave:nth-child(2) { animation-delay: 0.9s; }

      @keyframes signal-pulse {
        0% { opacity: 0.8; transform: scale(0.75); }
        100% { opacity: 0; transform: scale(1.35); }
      }

      .device-model-art--pc .screen,
      .device-model-art--pc .screen-line,
      .device-model-art--pc .screen-cursor,
      .device-model-art--monitor .screen-cursor,
      .device-model-art--fernseher .screen-cursor {
        animation: cursor-blink 0.8s steps(2, end) infinite;
      }

      .device-model-art--mini-pc .status-light,
      .device-model-art--tv-box .status-light {
        animation: status-blink 1.1s steps(2, end) infinite;
      }

      .device-model-art--dvd-player .disc {
        transform-box: fill-box;
        transform-origin: center;
        animation: disc-spin 2.4s linear infinite;
      }

      @keyframes disc-spin {
        to { transform: rotate(360deg); }
      }

      .device-model-art--monitor .screen-line,
      .device-model-art--fernseher .screen-line,
      .device-model-art--pc .screen-line {
        stroke-dasharray: 42;
        stroke-dashoffset: 42;
        animation: screen-write 2.8s steps(12, end) infinite;
      }

      .device-model-art--monitor .screen-line:nth-of-type(2),
      .device-model-art--fernseher .screen-line:nth-of-type(2),
      .device-model-art--pc .screen-line:nth-of-type(2) { animation-delay: 0.25s; }

      .device-model-art--monitor .screen-line:nth-of-type(3),
      .device-model-art--fernseher .screen-line:nth-of-type(3),
      .device-model-art--pc .screen-line:nth-of-type(3) { animation-delay: 0.5s; }

      @keyframes screen-write {
        0%, 12% { stroke-dashoffset: 42; }
        62%, 88% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 42; }
      }

      @keyframes cursor-blink {
        50% { opacity: 0; }
      }

      .device-model-art--drucker .printer-paper {
        animation: paper-feed 1.8s ease-in-out infinite;
      }

      @keyframes paper-feed {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(3px); }
      }

      .device-model-art--3d-drucker .print-head {
        animation: print-sweep 1.6s ease-in-out infinite alternate;
      }

      .device-model-art--3d-drucker .print-bed {
        animation: print-bed 2.4s ease-in-out infinite;
      }

      @keyframes print-sweep {
        to { transform: translateX(16px); }
      }

      @keyframes print-bed {
        50% { transform: translateY(2px); }
      }

      .device-model-art--tastatur .key-press {
        animation: key-tap 1.3s ease-in-out infinite;
      }

      .device-model-art--tastatur .key-press:nth-child(2) { animation-delay: 0.2s; }
      .device-model-art--tastatur .key-press:nth-child(3) { animation-delay: 0.4s; }

      @keyframes key-tap {
        0%, 70%, 100% { opacity: 1; }
        35% { opacity: 0.25; }
      }

      .device-model-art--maus .mouse-wheel { animation: mouse-click 1.5s ease-in-out infinite; }

      @keyframes mouse-click {
        50% { transform: translateY(2px); }
      }

      .device-model-art--kamera .camera-lens { animation: lens-focus 2.6s ease-in-out infinite; }
      .device-model-art--kamera .camera-lens,
      .device-model-art--lautsprecher .speaker-cone {
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes lens-focus {
        50% { transform: scale(0.78); }
      }

      .device-model-art--lautsprecher .speaker-cone { animation: speaker-thump 0.65s ease-in-out infinite alternate; }

      @keyframes speaker-thump {
        to { transform: scale(1.12); }
      }

      .device-model-art--lampe .lamp-glow { animation: lamp-glow 2s ease-in-out infinite alternate; }

      @keyframes lamp-glow {
        to { opacity: 0.45; }
      }

      .device-model-art--switch .status-light:nth-of-type(2n),
      .device-model-art--server .status-light:nth-of-type(2n),
      .device-model-art--nas .status-light:nth-of-type(2n),
      .device-model-art--usb-hub .status-light:nth-of-type(2n),
      .device-model-art--steckdosenleiste .status-light:nth-of-type(2n) {
        animation-delay: 0.45s;
      }

      .device-model-art--gaming-konsole .controller-light {
        animation: status-blink 1.5s steps(2, end) infinite;
      }

      .device-model-art--adapter .adapter-light { animation: status-blink 1s steps(2, end) infinite; }

      .device-model-art--steckdose .socket-spark { animation: status-blink 1.4s ease-in-out infinite; }

      .device-model-art--sonstiges > path:first-child {
        transform-box: fill-box;
        transform-origin: center;
        animation: other-device-pulse 2.2s ease-in-out infinite;
      }

      .device-model-art--gpu-server .gpu-core {
        animation: gpu-pulse 1.8s ease-in-out infinite alternate;
      }

      .device-model-art .fan-blade {
        transform-box: fill-box;
        transform-origin: center;
        animation: fan-spin 1.1s linear infinite;
      }

      @keyframes gpu-pulse {
        to { filter: brightness(1.35); }
      }

      @keyframes fan-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes other-device-pulse {
        50% { opacity: 0.65; }
      }

      .device-model-art--fernseher .screen-line {
        animation-duration: 3.8s;
      }

      @media (prefers-reduced-motion: reduce) {

          animation: none !important;

      .device-copy {
        min-width: 0;
      }

      .device-description {
        display: -webkit-box;
        overflow: hidden;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .device-power {

        font-weight: 700;

      .port {
        position: absolute;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: var(--panel);
        border: 2px solid #373e4c;
        box-shadow: 0 0 0 2px rgba(255,255,255,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%);
        cursor: pointer;
        font-size: 10px;
        font-weight: 700;
        color: var(--text);
        transition: transform 0.14s ease, background-color 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;

      .port:hover,
      .port.active {
        background: var(--primary-soft);
        border-color: var(--primary);
        transform: translate(-50%, -50%) scale(1.12);
        box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.14);

      .port.active {
        animation: port-pulse 0.8s ease-in-out infinite alternate;
      }

        to { box-shadow: 0 0 0 7px rgba(47, 111, 237, 0.06); }

      .port.used {
        background: #dfe9ff;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 18, 32, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 30;
      }

      .modal:not(.hidden) {
        animation: modal-backdrop-in 0.16s ease-out both;
      }

      @keyframes modal-backdrop-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .modal.hidden {
        display: none;
      }

      .modal-card {
        width: min(760px, 100%);
        max-height: 90vh;
        overflow: auto;
        background: var(--panel);

        box-shadow: var(--shadow);

      .modal-header {

      .port-config {

      .port-check {

      .hardware-options {

      .color-picker-input {
        position: fixed;
        left: -10000px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        background: rgba(29, 42, 57, 0.96);
        color: white;
        padding: 10px 14px;

      @media (prefers-reduced-motion: reduce) {

      .help-book-page {

      .help-book-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 20px 11px 25px; border-top: 1px solid #c7ad7d; background: #ead7ad; font: 12px/1.3 Arial, sans-serif; color: #755735; }
      .help-book-footer > div { display: flex; align-items: center; gap: 10px; }

      @media (max-width: 760px) {
        .help-overlay { padding: 6px; }
        .help-book { width: 100%; max-height: 98vh; }
        .help-book-spread { grid-template-columns: 1fr; }
        .help-book-index { padding: 13px 13px 14px; border-right: 0; border-bottom: 1px solid #d6c39e; max-height: 175px; overflow: auto; }
        .help-book-index-title { margin-bottom: 5px; }
        .help-chapter-button { display: inline-flex; width: auto; max-width: 100%; margin-right: 4px; padding: 6px; }
        .help-book-page { padding: 18px 20px 22px; }
        .help-book-page p, .help-book-page li { font-size: 14px; }
        .help-book-footer { padding: 9px 10px; }
        .help-book-footer button { min-width: auto; }
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-actions">
          <div class="topbar-left">
            <div class="brand">Serverplaner</div>
            <div class="lang-toggle" aria-label="language switcher">
              <button class="active" data-lang="de">DE</button>
              <button data-lang="en">EN</button>
            </div>
            <button class="button" id="importJsonBtn" type="button">JSON Import</button>
            <button class="button" id="exportJsonBtn" type="button">JSON Export</button>
            <input id="importFileInput" class="hidden" type="file" accept="application/json" />
            <input id="cableColorPicker" class="color-picker-input" type="color" aria-label="Kabelfarbe" />
          </div>

          <div class="topbar-right">
            <button class="button" id="deleteSelectionBtn" type="button">Löschen</button>
            <div class="zoom-controls" aria-label="Zoom">
              <button class="button" id="zoomOutBtn" type="button" aria-label="Verkleinern" title="Verkleinern">−</button>
              <span class="zoom-level" id="zoomLevel" aria-live="polite">100%</span>
              <button class="button" id="zoomInBtn" type="button" aria-label="Vergrößern" title="Vergrößern">+</button>
            </div>
            <button class="button" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="helpModal"><span aria-hidden="true">📖</span> <span id="helpBtnLabel">Hilfe</span></button>
            <button class="button" id="themeToggleBtn" type="button" aria-pressed="false"><span aria-hidden="true">◐</span> <span id="themeToggleLabel">Dunkelmodus</span></button>
          </div>
        </div>

        <div class="power-wrap" id="powerWrap">
          <div class="power-label" id="powerLabel">Rack-Leistung: 0 / 7680 W</div>
          <div class="power-bar"><div class="power-fill" id="powerFill"></div></div>
        </div>
      </header>

      <div class="main">
        <aside class="sidebar">
          <div class="sidebar-section">
            <button class="button primary" id="addDeviceSidebarBtn" type="button">Gerät hinzufügen</button>
          </div>

          <div class="sidebar-section">
            <h3 id="cableTypeTitle">Kabeltyp</h3>

          <div class="sidebar-section">
            <h3 id="deviceListTitle">Geräte</h3>
            <div class="device-list" id="deviceList"></div>
          </div>
        </aside>

        <main class="canvas-shell">
          <div id="canvas" class="canvas" aria-label="Arbeitsfläche">

            </div>
          </div>
        </main>
      </div>

        <div class="modal-body">
          <form id="deviceForm">
            <div class="form-grid">
              <div class="field">
                <label for="deviceName">Name</label>
                <input id="deviceName" type="text" />
              </div>

              <div class="field">
                <label for="deviceType">Typ</label>
                <select id="deviceType"></select>
              </div>

              <div class="field full">
                <label for="deviceDescription">Beschreibung</label>
                <textarea id="deviceDescription"></textarea>
              </div>

              <div class="field">
                <label for="deviceStorageValue">Speicherkapazität</label>

                  <input id="deviceStorageValue" type="number" min="0" step="1" />

              </div>

              <div class="field hidden" id="ramTypeField">
                <label for="deviceRamType">RAM-Typ</label>
                <select id="deviceRamType">
                  <option value="">Nicht angegeben</option>
                  <option value="DDR3">DDR3</option>
                  <option value="DDR4">DDR4</option>
                  <option value="DDR5">DDR5</option>

            <div class="modal-actions">

              <div style="display:flex; gap:8px;">
                <button class="button" id="cancelDeviceBtn" type="button">Abbrechen</button>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

          state.lang = parsed.lang || 'de';
          state.theme = parsed.theme === 'dark' ? 'dark' : 'light';
          state.zoom = Number.isFinite(Number(parsed.zoom)) ? clamp(Number(parsed.zoom), MIN_ZOOM, MAX_ZOOM) : 1;
          state.selectedCableType = parsed.selectedCableType || 'LAN';
          state.nextCounter = Number(parsed.nextCounter || 1);
          state.devices = new Map((parsed.devices || []).map((device) => [device.id, device]));
          state.cables = new Map((parsed.cables || []).map((cable) => [cable.id, cable]));
        } catch (error) {
          console.error('Could not load state', error);

            '9965': 500, '9995': 500
          };
          const fullId = (name.match(/epyc\s+(\d{4,5}[a-z]?)/) || [])[1] || id;
          if (known[fullId]) return known[fullId];
          if (/epyc embedded/.test(name)) return 35;
          if (/\b99\d\d\b/.test(name)) return 500;
          if (/\b9[678]\d\d\b/.test(name)) return 360;
          if (/\b9[345]\d\d\b/.test(name)) return 280;

      function estimateGpuPowerWatt(model, deviceType) {

      function estimateSelectedHardwarePowerWatt(deviceType, cpuModel, gpuModel) {
        const cpu = String(cpuModel || '').trim();
        const gpu = String(gpuModel || '').trim();
        if (!cpu && !gpu) return getDefaultPowerWatt(deviceType);
        const base = hardwareBasePowerWattByType[deviceType] ?? Math.max(15, Math.round(getDefaultPowerWatt(deviceType) * 0.2));
        return Math.round(base + estimateCpuPowerWatt(cpu, deviceType) + estimateGpuPowerWatt(gpu, deviceType));
      }

      function updatePowerEstimateFromHardware() {
        const deviceType = ui.deviceType.value;
        const cpuModel = hardwareSpecTypes.has(deviceType) ? ui.cpuModel.value : '';
        const gpuModel = gpuSpecTypes.has(deviceType) ? ui.gpuModel.value : '';
        ui.devicePowerWatt.value = estimateSelectedHardwarePowerWatt(deviceType, cpuModel, gpuModel);
        ui.devicePowerWatt.dataset.customized = 'false';
      }

      function hasPowerInput(ports, powerWatt) {
        return ports.some((port) => isPowerPort(port.type)) || (
          Number(powerWatt) <= 100 && ports.some((port) => (port.type || '').trim().toLowerCase() === 'lan')
        );
      }

      function calculateTotalPower() {
        let total = 0;
        state.devices.forEach((device) => {
          const watt = Number(device.powerWatt) || 0;
          total += watt;
        });
        return total;
      }

      function getConnectedEndpoint(device, port) {
        const cable = port.cableId ? state.cables.get(port.cableId) : null;
        if (!cable) return null;
        if (cable.fromDeviceId === device.id && cable.fromPortId === port.id) {
          const otherDevice = getDeviceById(cable.toDeviceId);
          return otherDevice ? { device: otherDevice, port: getPortById(otherDevice.id, cable.toPortId) } : null;
        }
        if (cable.toDeviceId === device.id && cable.toPortId === port.id) {
          const otherDevice = getDeviceById(cable.fromDeviceId);
          return otherDevice ? { device: otherDevice, port: getPortById(otherDevice.id, cable.fromPortId) } : null;
        }
        return null;
      }

      function calculateDeviceLoad(device, visited = new Set()) {
        if (!device) return 0;
        if (!powerDistributionTypes.has(device.type)) return Number(device.powerWatt) || 0;
        if (visited.has(device.id)) return 0;
        visited.add(device.id);
        const total = device.ports
          .filter((port) => port.powerRole === 'outlet')
          .reduce((sum, port) => sum + calculateOutletLoad(device, port, visited), 0);
        visited.delete(device.id);
        return total;
      }

      function calculateOutletLoad(device, port, visited = new Set()) {
        const endpoint = getConnectedEndpoint(device, port);
        return endpoint ? calculateDeviceLoad(endpoint.device, visited) : 0;
      }

      function renderPowerBar() {
        const total = calculateTotalPower();
        const percent = clamp((total / state.maxPowerWatt) * 100, 0, 100);
        const warning = total > state.maxPowerWatt;
        ui.powerFill.style.width = `${percent}%`;
        ui.powerLabel.textContent = `${t('power')}: ${total} / ${state.maxPowerWatt} W`;
        ui.powerWrap.classList.toggle('warning', warning);
        if (warning) {
          ui.powerLabel.title = t('warnOverLimit');
        } else {
          ui.powerLabel.title = 'OK';
        }
      }

        return /mobile|laptop|notebook|snapdragon|apple\s+[am]\d|mediatek|dimensity|exynos|arm cortex|celeron n\d|pentium silver n|atom x[357]|ryzen z\d|ryzen ai/i.test(name)

          || /\bIntel Core i[3579]-?\d{4,5}(?:U|H|HK|HQ|HX|Y|P|V|M|G[1-7])\b/i.test(name)
          || /\bIntel Core Ultra\b.*\b\d{3,5}(?:U|H|V|P)\b/i.test(name)
          || /\bRyzen AI\b/i.test(name);

      function isMobileGpuName(name) {
        // UHD 730/750/770 are desktop iGPUs, not laptop/mini-PC mobile models.
        if (/intel uhd graphics (?:730|750|770)\b/i.test(name)) return false;
        return /laptop gpu|mobile|max-q|nvidia geForce mx\d{3}\b|intel arc [ab]\d{3,4}m\b|\b(?:gtx|rtx|quadro)\s*\d{3,4}m\b|radeon.*\b\d{3,4}[ms]\b|intel (?:uhd|iris|hd graphics)|intel arc graphics|amd radeon graphics|adreno|mali|apple.*gpu/i.test(name);
      }

      function getCompatibleCpuNames(type) {
        return isMobileDeviceType(type) ? cpuNames.filter(isMobileCpuName) : cpuNames;
      }

        return isMobileDeviceType(type) ? gpuNames.filter(isMobileGpuName) : gpuNames;

      function populateHardwareLists() {
        const bindSearchList = (inputId, listId, names) => {
          const input = document.getElementById(inputId);
          const list = document.getElementById(listId);
          const wrapper = input.closest('.field');
          const closeList = () => {
            list.classList.add('hidden');
            input.setAttribute('aria-expanded', 'false');
          };
          const renderOptions = () => {
            const availableNames = typeof names === 'function' ? names() : names;
            const query = input.value.trim().toLocaleLowerCase();
            const matches = query ? availableNames.filter((name) => name.toLocaleLowerCase().includes(query)) : availableNames;
            const options = document.createDocumentFragment();
            matches.forEach((name) => {
              const option = document.createElement('button');
              option.type = 'button';
              option.className = 'hardware-option';
              option.setAttribute('role', 'option');
              option.textContent = name;
              option.addEventListener('click', () => {
                input.value = name;
                input.dispatchEvent(new Event('change', { bubbles: true }));
                closeList();
              });
              options.appendChild(option);
            });
            list.replaceChildren(options);
            list.classList.remove('hidden');
            input.setAttribute('aria-expanded', 'true');
          };

          input.addEventListener('focus', renderOptions);
          input.addEventListener('input', renderOptions);
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeList();
            if (event.key === 'ArrowDown' && list.firstElementChild) {
              event.preventDefault();
              list.firstElementChild.focus();
            }
            if (event.key === 'Enter' && !list.classList.contains('hidden') && list.firstElementChild) {
              event.preventDefault();
              list.firstElementChild.click();
            }
          });
          list.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
              closeList();
              input.focus();
            }
          });
          document.addEventListener('click', (event) => {
            if (!wrapper.contains(event.target)) closeList();
          });
        };
        bindSearchList('deviceCpuModel', 'cpuNameOptions', () => getCompatibleCpuNames(ui.deviceType.value));
        bindSearchList('deviceGpuModel', 'gpuNameOptions', () => getCompatibleGpuNames(ui.deviceType.value));
      }

      // Port configuration and cable compatibility.
      function getPortSpeedOptions(portType) {
        const base = portType.toLowerCase();
        if (base.includes('lan')) return ['100 Mbps', '1 GbE', '2.5 GbE', '10 GbE'];
        if (base.includes('usb')) return ['1.1', '2.0', '3.0', '3.1', '3.2', 'USB-C'];
        if (base.includes('thunderbolt')) return ['3', '4', '5'];
        if (base.includes('hdmi')) return ['HDMI 1.4', 'HDMI 2.0', 'HDMI 2.1'];
        if (base.includes('displayport')) return ['1.2', '1.4', '2.0', '2.1'];
        if (base.includes('vga')) return ['VGA'];
        if (base.includes('dvi')) return ['DVI-D', 'DVI-I'];
        if (base.includes('klinke') || base.includes('cinch') || base.includes('xlr')) return ['3,5 mm', '6,3 mm', 'RCA', 'XLR'];
        if (base.includes('sfp')) return ['SFP', 'SFP+'];
        if (base.includes('sd')) return ['SD', 'SDHC', 'SDXC'];
        if (base.includes('lightning')) return ['Lightning'];
        return ['Standard'];
      }

      function formatPortLabel(portType, speed) {
        if (!speed || speed === 'Standard') return portType;
        return `${portType} ${speed}`;
      }

      function getPortShortLabel(portType, speed) {
        const type = (portType || '').trim();
        const speedText = ((speed || '').trim() || type).trim();
        const lowerType = type.toLowerCase();

        if (lowerType === 'usb-c') return 'UC';
        if (lowerType.includes('usb') || lowerType.startsWith('usb')) {
          const match = (speedText.match(/\d+(?:\.\d+)?/) || [''])[0];
          const main = match.includes('.') ? match.split('.')[0] : match;
          return match ? `U${main}` : 'U';
        }
        if (lowerType.includes('lan')) return 'L';
        if (lowerType.includes('thunderbolt')) return 'T';
        if (lowerType.includes('hdmi')) return 'H';
        if (lowerType.includes('displayport')) return 'DP';
        if (lowerType.includes('vga')) return 'V';
        if (lowerType.includes('dvi')) return 'D';
        if (lowerType.includes('sfp')) return 'S';
        if (lowerType.includes('lightning')) return 'Li';
        if (lowerType.includes('sd')) return 'SD';
        return type.slice(0, 2).toUpperCase();
      }

        typeSelect.value = port ? port.type : 'LAN';

        const sideSelect = document.createElement('select');

      function syncHardwareFields() {

      function getDeviceById(id) {

      function getPortById(deviceId, portId) {
        const device = getDeviceById(deviceId);

      }

      function getCableColor(type) {
        const customColors = window.__wireWizardCableTypeColors || {};
        return customColors[type] || cableColors[type] || cableColors.Sonstiges;
      }

      const cableColorPalette = [
        '#e63946', '#0077b6', '#2a9d8f', '#f4a261', '#7b2cbf', '#d63384',
        '#588157', '#e9c46a', '#264653', '#ff6b35', '#495057', '#00a896',
      ];

      function hueToHex(hue) {
        const chroma = 0.7 * (1 - Math.abs(2 * 0.46 - 1));
        const segment = hue / 60;
        const secondary = chroma * (1 - Math.abs(segment % 2 - 1));
        const offset = 0.46 - chroma / 2;
        let rgb;
        if (segment < 1) rgb = [chroma, secondary, 0];
        else if (segment < 2) rgb = [secondary, chroma, 0];
        else if (segment < 3) rgb = [0, chroma, secondary];
        else if (segment < 4) rgb = [0, secondary, chroma];
        else if (segment < 5) rgb = [secondary, 0, chroma];
        else rgb = [chroma, 0, secondary];
        return `#${rgb.map((value) => Math.round((value + offset) * 255).toString(16).padStart(2, '0')).join('')}`;
      }

      function getUniqueCableColor() {
        const usedColors = new Set([...state.cables.values()].map((cable) => {
          return (cable.color || getCableColor(cable.type)).toLowerCase();
        }));
        const paletteColor = cableColorPalette.find((color) => !usedColors.has(color));
        if (paletteColor) return paletteColor;

        for (let index = 0; index < 360; index++) {
          const color = hueToHex((index * 137.508) % 360);
          if (!usedColors.has(color)) return color;
        }
        return '#000000';
      }

      function getCompatibleCableTypes(portType) {
        const type = (portType || '').trim().toLowerCase();
        if (type.includes('usb')) return ['USB'];
        if (type.includes('lan')) return ['LAN', 'Cat6'];
        if (type.includes('qsfp56')) return ['QSFP56', 'InfiniBand', 'Fiber', 'DAC'];
        if (type.includes('qsfp28')) return ['QSFP28', 'InfiniBand', 'Fiber', 'DAC'];
        if (type.includes('infiniband')) return ['InfiniBand', 'Fiber', 'DAC'];
        if (type.includes('fibre channel')) return ['Fibre Channel', 'Fiber'];
        if (type === 'sas') return ['SAS', 'DAC'];
        if (type.includes('hdmi')) return ['HDMI'];
        if (type.includes('displayport')) return ['DisplayPort'];
        if (type === 'serial') return ['Serial'];
        if (type === 'schuko' || type.includes('iec c')) return ['Strom', 'Stromkabel'];
        if (type.includes('sfp')) return ['SFP', 'Fiber', 'DAC'];
        return ['Sonstiges'];
      }
      function isCableCompatible(port, cableType, device = null) {
        if (!port || !getCompatibleCableTypes(port.type).includes(cableType)) return false;
        if (cableType === 'PoE') return Number(device && device.powerWatt) <= 100;
        return true;
      }

      function randomPosition(w = 190, h = 135) {
        const margin = 40;
        const shell = ui.canvas.parentElement;
        const contentRect = ui.canvasContent.getBoundingClientRect();
        const shellRect = shell.getBoundingClientRect();
        const scaleX = contentRect.width / ui.canvasContent.offsetWidth;
        const scaleY = contentRect.height / ui.canvasContent.offsetHeight;
        const visibleLeft = clamp(Math.max(contentRect.left, shellRect.left + shell.clientLeft, 0), contentRect.left, contentRect.right);
        const visibleRight = clamp(Math.min(contentRect.right, shellRect.left + shell.clientLeft + shell.clientWidth, window.innerWidth), contentRect.left, contentRect.right);
        const visibleTop = clamp(Math.max(contentRect.top, shellRect.top + shell.clientTop, 0), contentRect.top, contentRect.bottom);
        const visibleBottom = clamp(Math.min(contentRect.bottom, shellRect.top + shell.clientTop + shell.clientHeight, window.innerHeight), contentRect.top, contentRect.bottom);
        const visibleMinX = clamp((visibleLeft - contentRect.left) / scaleX, 0, ui.canvasContent.offsetWidth);
        const visibleMaxX = clamp((visibleRight - contentRect.left) / scaleX, 0, ui.canvasContent.offsetWidth);
        const visibleMinY = clamp((visibleTop - contentRect.top) / scaleY, 0, ui.canvasContent.offsetHeight);
        const visibleMaxY = clamp((visibleBottom - contentRect.top) / scaleY, 0, ui.canvasContent.offsetHeight);
        const canvasMaxX = Math.max(0, ui.canvasContent.offsetWidth - w);
        const canvasMaxY = Math.max(0, ui.canvasContent.offsetHeight - h);
        let minX = Math.max(margin, visibleMinX);
        let maxX = Math.min(canvasMaxX - margin, visibleMaxX - w);
        let minY = Math.max(margin, visibleMinY);
        let maxY = Math.min(canvasMaxY - margin, visibleMaxY - h);

        if (maxX < minX) minX = maxX = clamp((visibleMinX + visibleMaxX - w) / 2, 0, canvasMaxX);
        if (maxY < minY) minY = maxY = clamp((visibleMinY + visibleMaxY - h) / 2, 0, canvasMaxY);

        let x = minX + Math.random() * Math.max(0, maxX - minX);
        let y = minY + Math.random() * Math.max(0, maxY - minY);
        let attempts = 0;
        while (attempts < 300) {
          const collision = [...state.devices.values()].some((device) => {
            return !(x + w < device.x - 30 || x > device.x + device.w + 30 || y + h < device.y - 30 || y > device.y + device.h + 30);
          });
          if (!collision) return { x: clamp(x, minX, maxX), y: clamp(y, minY, maxY) };
          x = minX + Math.random() * Math.max(0, maxX - minX);
          y = minY + Math.random() * Math.max(0, maxY - minY);
          attempts++;
        }
        return { x: minX, y: minY };
      }

      function openDeviceModal(deviceId = null) {
        if (deviceId) {
          const device = getDeviceById(deviceId);
          if (!device) return;
          state.openDeviceId = deviceId;
          ui.modal.classList.remove('hidden');
          updateDeviceForm(device);
        } else {
          state.openDeviceId = null;
          ui.modal.classList.remove('hidden');
          updateDeviceForm(null);
        }
      }

      function closeDeviceModal() {
        state.openDeviceId = null;
        ui.modal.classList.add('hidden');
      }

      function buildPortListFromForm(device) {
        const selected = [];
        const reusedPortIds = new Set();
        const rows = [...ui.portConfig.children];
        rows.forEach((row) => {
          const typeSelect = row.querySelector('[data-role="type"]');
          const sideSelect = row.querySelector('[data-role="side"]');
          const speedSelect = row.querySelector('[data-role="speed"]');
          const amountInput = row.querySelector('[data-role="amount"]');
          if (!typeSelect || !sideSelect || !speedSelect || !amountInput) return;

          const portType = typeSelect.value;
          const speed = speedSelect.value || 'Standard';
          const amount = Math.max(1, Number(amountInput.value || 1));
          const label = formatPortLabel(portType, speed);

          for (let i = 0; i < amount; i++) {
            const matchedPort = device
              ? device.ports.find((p) => p.type === portType && p.speed === speed && p.side === sideSelect.value && !reusedPortIds.has(p.id))
              : null;
            if (matchedPort) reusedPortIds.add(matchedPort.id);
            const portId = matchedPort ? matchedPort.id : uid('port');
            selected.push({
              id: portId,
              type: portType,
              label,
              side: sideSelect.value,
              speed,
              amount,
              cableId: matchedPort ? matchedPort.cableId : null,
            });
          }
        });

        return selected.length ? selected : [{ id: uid('port'), type: 'Schuko', label: 'Schuko', side: 'left', speed: 'Standard', amount: 1, cableId: null }];
      }

      function buildSocketPorts(device, outletCount, deviceType = 'Steckdosenleiste') {
        const previousPorts = device ? device.ports || [] : [];
        const existingInput = previousPorts.find((port) => port.powerRole === 'input');
        const existingOutlets = previousPorts.filter((port) => port.powerRole === 'outlet');
        const rackPower = ['Rack-PDU', 'USV'].includes(deviceType);
        const inputType = rackPower ? 'IEC C20' : 'Schuko';
        const outletType = rackPower ? 'IEC C13' : 'Schuko';
        const inputPort = {
          ...(existingInput || {}),
          id: existingInput ? existingInput.id : uid('port'),
          type: inputType,
          label: rackPower ? 'Einspeisung IEC C20' : 'Stromanschluss',
          side: 'left',
          speed: 'Standard',
          powerRole: 'input',
          cableId: existingInput ? existingInput.cableId : null,
        };
        const outlets = Array.from({ length: outletCount }, (_, index) => {
          const outletNumber = index + 1;
          const previous = existingOutlets.find((port) => port.outletNumber === outletNumber);
          return {
            ...(previous || {}),
            id: previous ? previous.id : uid('port'),
            type: outletType,
            label: rackPower ? `IEC C13 Ausgang ${outletNumber}` : `Steckdose ${outletNumber}`,
            side: 'right',
            speed: 'Standard',
            powerRole: 'outlet',
            outletNumber,
            amount: 1,
            cableId: previous ? previous.cableId : null,
          };
        });
        return [inputPort, ...outlets];
      }

      function buildDevicePorts(device, deviceType) {
        if (deviceType === 'Kabelorganisator') return [];
        if (deviceType === 'Steckdose') return buildSocketPorts(device, 1, deviceType).slice(1);
        if (powerDistributionTypes.has(deviceType) && deviceType !== 'Steckdose') {
          const outletCount = clamp(Math.floor(Number(ui.outletCountInput.value) || 1), 1, 20);
          ui.outletCountInput.value = outletCount;
          return buildSocketPorts(device, outletCount, deviceType);
        }
        return buildPortListFromForm(device);
      }

      function hasRemovedConnectedPorts(existing, nextPorts) {
        if (!existing) return false;
        const nextPortIds = new Set(nextPorts.map((port) => port.id));
        return existing.ports.some((port) => port.cableId && !nextPortIds.has(port.id));
      }

      function saveDeviceFromForm(event) {
        event.preventDefault();
        if (!ui.deviceName.value.trim()) {
          showToast(t('deviceNameRequired'));
          return;
        }

        const deviceInput = {
          id: state.openDeviceId || uid('device'),
          name: ui.deviceName.value.trim(),
          description: ui.deviceDescription.value.trim(),
          storage: Number(ui.deviceStorageValue.value || 0),
          storageUnit: ui.deviceStorageUnit.value,
          cpuModel: ui.cpuModel.value.trim(),
          ramGb: Number(ui.ramGb.value || 0),
          ramType: ui.ramType.value,
          cpuCores: Number(ui.cpuCores.value || 0),
          cpuClockGHz: Number(ui.cpuClockGHz.value || 0),
          gpuModel: ui.gpuModel.value.trim(),
          powerWatt: Number(ui.devicePowerWatt.value || 0),
          type: ui.deviceType.value,
          w: 190,
          h: powerDistributionTypes.has(ui.deviceType.value) && ui.deviceType.value !== 'Steckdose'
            ? Math.max(150, 110 + clamp(Math.floor(Number(ui.outletCountInput.value) || 1), 1, 20) * 25)
            : (ui.deviceType.value === 'Steckdose' ? 160 : 135),
          ports: []
        };

        const existing = state.devices.get(deviceInput.id);
        deviceInput.ports = buildDevicePorts(existing, deviceInput.type);
        const portsBySide = deviceInput.ports.reduce((counts, port) => {
          const side = port.side || 'right';
          counts[side] = (counts[side] || 0) + 1;
          return counts;
        }, {});
        const verticalPortCount = Math.max(portsBySide.left || 0, portsBySide.right || 0);
        const horizontalPortCount = Math.max(portsBySide.top || 0, portsBySide.bottom || 0);
        deviceInput.h = Math.max(deviceInput.h, verticalPortCount * 26 + 26);
        deviceInput.w = Math.max(deviceInput.w, horizontalPortCount * 26 + 26);
        if (deviceInput.type !== 'Kabelorganisator' && !hasPowerInput(deviceInput.ports, deviceInput.powerWatt)) {
          showToast(t('missingPowerPort'));
          return;
        }
        if (existing && hasRemovedConnectedPorts(existing, deviceInput.ports)) {
          showToast(t('removeOutletCableFirst'));
          return;
        }
        if (existing) {
          deviceInput.x = existing.x;
          deviceInput.y = existing.y;
          state.devices.set(deviceInput.id, { ...existing, ...deviceInput });
        } else {
          const pos = randomPosition(deviceInput.w, deviceInput.h);
          deviceInput.x = pos.x;
          deviceInput.y = pos.y;
          state.enteringDeviceId = deviceInput.id;
          state.devices.set(deviceInput.id, deviceInput);
        }

        saveState();
        render();
        state.enteringDeviceId = null;
        closeDeviceModal();
        showToast(t('saved'));
      }

      function deleteSelectedDevice() {
        const selectedId = state.selectedDeviceId;
        if (!selectedId) {
          showToast(t('noDeviceSelected'));
          return;
        }
        const device = state.devices.get(selectedId);
        if (!device) return;
        const relatedCableIds = [...state.cables.keys()].filter((cableId) => {
          const cable = state.cables.get(cableId);
          return cable && (cable.fromDeviceId === device.id || cable.toDeviceId === device.id);
        });
        relatedCableIds.forEach((cableId) => state.cables.delete(cableId));
        state.devices.delete(selectedId);
        if (state.hoveredDeviceId === selectedId) state.hoveredDeviceId = null;
        state.selectedDeviceId = null;
        state.selectedCableId = null;
        saveState();
        render();
      }

      function deleteSelectedCable() {
        const cableId = state.selectedCableId;
        if (!cableId) return;
        state.cables.delete(cableId);
        state.devices.forEach((device) => {
          device.ports.forEach((port) => {
            if (port.cableId === cableId) port.cableId = null;
          });
        });
        state.selectedCableId = null;
        saveState();
        render();
      }

        const typeClass = String(type || 'Sonstiges').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const iconId = `device-icon-${++deviceModelSvgCounter}-${typeClass}`;
        const fillGradientMap = {
          '#d7e5ee': 'metal',
          '#b9def2': 'glass',
          '#9fb8c8': 'steel',
          '#eef4f7': 'porcelain',
          '#f8fbfc': 'porcelain',
          '#fff': 'paper',
          '#ffffff': 'paper',
          '#7098ad': 'lens',
          '#3d9b65': 'pcb',
          '#252f39': 'chip',
          '#8ab4c7': 'chipMetal',
          '#e6c85a': 'gold',
          '#f2d7a0': 'gold',
          '#f5d78e': 'lamp'

        let modelMarkup = models[type] || models.Sonstiges;
        modelMarkup = modelMarkup.replace(/fill="(#[0-9a-fA-F]{3,8})"/g, (match, color) => {
          const gradient = fillGradientMap[color.toLowerCase()];
          return gradient ? `fill="url(#${iconId}-${gradient})"` : match;

      // Draw the devices and refresh their ports after each state change.
      function renderDevices() {
        ui.deviceLayer.innerHTML = '';
        state.devices.forEach((device) => {
          const node = document.createElement('div');
          node.className = 'device' + (state.selectedDeviceId === device.id ? ' selected' : '');
          node.style.width = Math.max(170, Math.min(330, 150 + (device.ports || []).length * 5)) + 'px';
          if (state.enteringDeviceId === device.id) node.classList.add('device-entering');
          node.style.left = `${device.x}px`;
          node.style.top = `${device.y}px`;
          node.style.width = `${device.w}px`;
          node.style.height = `${device.h}px`;
          node.dataset.deviceId = device.id;

          node.addEventListener('mouseenter', () => {
            state.hoveredDeviceId = device.id;
          });
          node.addEventListener('mouseleave', () => {
            if (state.hoveredDeviceId === device.id) state.hoveredDeviceId = null;
          });

          const header = document.createElement('div');
          header.className = 'device-header';
          const name = document.createElement('div');
          name.className = 'device-name';
          name.textContent = device.name || 'Gerät';
          const chip = document.createElement('span');
          chip.className = 'small-button';
          chip.textContent = getDeviceTypeLabel(device.type);
          header.appendChild(name);
          header.appendChild(chip);

          const body = document.createElement('div');
          body.className = 'device-body';
          const model = document.createElement('div');
          model.className = 'device-model';
          model.innerHTML = getDeviceModelSvg(device.type);
          const copy = document.createElement('div');
          copy.className = 'device-copy';
          const description = document.createElement('div');
          description.className = 'device-description';
          description.textContent = device.description || '—';
          const power = document.createElement('div');
          power.className = 'device-power';
          power.textContent = `${Number(device.powerWatt || 0)} W`;
          copy.appendChild(description);
          copy.appendChild(power);
          body.appendChild(model);
          body.appendChild(copy);
          const outletPorts = device.ports.filter((port) => port.powerRole === 'outlet');
          const outletMeterRows = outletPorts.map((port) => `
            <div class="outlet-meter-row">
              <span>${getPortDisplayLabel(port.label)}</span>
              <strong>${calculateOutletLoad(device, port)} W</strong>
            </div>
          `).join('');
          if (outletMeterRows) {
            const meterList = document.createElement('div');
            meterList.className = 'outlet-meter-list';
            meterList.innerHTML = outletMeterRows;
            body.appendChild(meterList);
          }

          node.appendChild(header);
          node.appendChild(body);

          const portsBySide = { left: [], right: [], top: [], bottom: [] };
          device.ports.forEach((port) => {
            const side = port.side || 'right';
            if (portsBySide[side]) portsBySide[side].push(port);
          });

          Object.entries(portsBySide).forEach(([side, list]) => {
            list.forEach((port, index) => {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'port' + (port.cableId ? ' used' : '');
              btn.dataset.deviceId = device.id;
              btn.dataset.portId = port.id;
              btn.dataset.side = side;
              btn.textContent = port.outletNumber ? `S${port.outletNumber}` : getPortShortLabel(port.type, port.speed || port.label);
              if (port.powerRole === 'outlet') btn.title = `${getPortDisplayLabel(port.label)}: ${calculateOutletLoad(device, port)} W`;

              let x = 0;
              let y = 0;
              const total = Math.max(list.length, 1);
              const ratio = (index + 1) / (total + 1);
              if (side === 'left') {
                x = 0;
                y = (device.h * ratio);
              } else if (side === 'right') {
                x = device.w;
                y = (device.h * ratio);
              } else if (side === 'top') {
                x = (device.w * ratio);
                y = 0;
              } else {
                x = (device.w * ratio);
                y = device.h;
              }
              btn.style.left = `${x}px`;
              btn.style.top = `${y}px`;

              btn.addEventListener('click', (event) => {
                event.stopPropagation();
                handlePortClick(device.id, port.id);
              });

              node.appendChild(btn);
            });
          });

          node.addEventListener('mousedown', (event) => {
            if (event.target.closest('.port')) return;
            state.selectedDeviceId = device.id;
            state.selectedCableId = null;
            startDragging(event, device.id);
          });

          node.addEventListener('click', () => {
            state.selectedDeviceId = device.id;
            openDeviceModal(device.id);
            renderDeviceList();
          });

          ui.deviceLayer.appendChild(node);
        });
      }

      function pathBetweenPorts(from, to) {
        const dx = Math.max(90, Math.abs(to.x - from.x) * 0.75);
        const cx1 = from.x + dx;
        const cy1 = from.y;
        const cx2 = to.x - dx;
        const cy2 = to.y;
        return `M ${from.x} ${from.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${to.x} ${to.y}`;
      }

      function getPortWorldPosition(device, port) {
        const portsBySide = { left: [], right: [], top: [], bottom: [] };
        device.ports.forEach((candidate) => {
          const side = candidate.side || 'right';
          if (portsBySide[side]) portsBySide[side].push(candidate);
        });
        const list = portsBySide[port.side] || [];
        const index = list.findIndex((candidate) => candidate.id === port.id);
        const total = Math.max(list.length, 1);
        const ratio = (index + 1) / (total + 1);

        let x = 0;
        let y = 0;

        if (port.side === 'left') {
          x = device.x;
          y = device.y + device.h * ratio;
        } else if (port.side === 'right') {
          x = device.x + device.w;
          y = device.y + device.h * ratio;
        } else if (port.side === 'top') {
          x = device.x + device.w * ratio;
          y = device.y;
        } else {
          x = device.x + device.w * ratio;
          y = device.y + device.h;
        }

        return { x, y };
      }

      function renderCables() {
        ui.cableLayer.innerHTML = '';
        state.cables.forEach((cable) => {
          const fromDevice = getDeviceById(cable.fromDeviceId);
          const toDevice = getDeviceById(cable.toDeviceId);
          const fromPort = fromDevice ? getPortById(cable.fromDeviceId, cable.fromPortId) : null;
          const toPort = toDevice ? getPortById(cable.toDeviceId, cable.toPortId) : null;
          if (!fromDevice || !toDevice || !fromPort || !toPort) return;

          const start = getPortWorldPosition(fromDevice, fromPort);
          const end = getPortWorldPosition(toDevice, toPort);
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', pathBetweenPorts(start, end));
          path.setAttribute('stroke', cable.color || getCableColor(cable.type));
          path.setAttribute('stroke-width', state.selectedCableId === cable.id ? '6' : '4');
          path.setAttribute('fill', 'none');
          path.setAttribute('class', 'cable-path' + (state.selectedCableId === cable.id ? ' selected' : ''));
          path.setAttribute('aria-label', getCableTypeLabel(cable.type));
          const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          title.textContent = getCableTypeLabel(cable.type);
          path.appendChild(title);
          path.style.pointerEvents = 'auto';
          path.addEventListener('pointermove', (event) => {
            const tooltip = ui.cableTooltip;
            tooltip.textContent = getCableTypeLabel(cable.type);
            tooltip.classList.add('visible');
            tooltip.setAttribute('aria-hidden', 'false');
            tooltip.style.left = `${Math.max(8, Math.min(event.clientX + 14, window.innerWidth - tooltip.offsetWidth - 8))}px`;
            tooltip.style.top = `${Math.max(8, Math.min(event.clientY + 14, window.innerHeight - tooltip.offsetHeight - 8))}px`;
          });
          path.addEventListener('pointerleave', () => {
            ui.cableTooltip.classList.remove('visible');
            ui.cableTooltip.setAttribute('aria-hidden', 'true');
          });
          path.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            state.selectedCableId = cable.id;
            ui.cableColorPicker.value = cable.color || getCableColor(cable.type);
            if (typeof ui.cableColorPicker.showPicker === 'function') ui.cableColorPicker.showPicker();
            else ui.cableColorPicker.click();
          });
          path.addEventListener('click', (event) => {
            event.stopPropagation();
            state.selectedCableId = cable.id;
            state.selectedDeviceId = null;
            render();
          });
          ui.cableLayer.appendChild(path);
        });
      }

      function handlePortClick(deviceId, portId) {
        const device = getDeviceById(deviceId);
        const port = getPortById(deviceId, portId);
        if (!device || !port) return;

        if (!state.selectedPort) {
          if (port.cableId) {
            showToast(t('occupiedPort'));
            return;
          }
          const compatibleCableTypes = getCompatibleCableTypes(port.type)
            .filter((type) => isCableCompatible(port, type, device));
          if (!compatibleCableTypes.includes(state.selectedCableType)) {
            state.selectedCableType = compatibleCableTypes[0] || 'Sonstiges';
            ui.cableTypeSelect.value = state.selectedCableType;
            saveState();
          }
          state.selectedPort = { deviceId, portId };
          const portNode = document.querySelector(`.port[data-device-id="${deviceId}"][data-port-id="${portId}"]`);
          if (portNode) portNode.classList.add('active');
          return;
        }

        const currentA = state.selectedPort;
        const deviceA = getDeviceById(currentA.deviceId);
        const portA = getPortById(currentA.deviceId, currentA.portId);
        const portB = port;

        if (portA && portB && portA.powerRole === 'outlet' && portB.powerRole === 'outlet') {
          showToast(t('incompatibleCable'));
          state.selectedPort = null;
          render();
          return;
        }

        if (currentA.deviceId === deviceId && currentA.portId === portId) {
          showToast(t('selfConnectionBlocked'));
          state.selectedPort = null;
          render();
          return;
        }

        const commonCableTypes = portA && portB
          ? getCompatibleCableTypes(portA.type).filter((type) => {
            return getCompatibleCableTypes(portB.type).includes(type)
              && isCableCompatible(portA, type, deviceA)
              && isCableCompatible(portB, type, device);
          })
          : [];
        const cableType = commonCableTypes.includes(state.selectedCableType)
          ? state.selectedCableType
          : commonCableTypes[0];
        if (!cableType) {
          showToast(t('incompatibleCable'));
          state.selectedPort = null;
          render();
          return;
        }

        if (portA && portB && (portA.cableId || portB.cableId)) {
          showToast(t('occupiedPort'));
          state.selectedPort = null;
          render();
          return;
        }

        const cableId = uid('cable');
        const cable = {
          id: cableId,
          type: cableType,
          color: getCableColor(cableType),
          fromDeviceId: currentA.deviceId,
          fromPortId: currentA.portId,
          toDeviceId: deviceId,
          toPortId: portId,
        };

        state.cables.set(cableId, cable);
        portA.cableId = cableId;
        portB.cableId = cableId;
        state.selectedCableType = cableType;
        state.selectedPort = null;
        saveState();
        render();
      }


      function getPortTypeLabel(portType) {
        const labels = state.lang === 'en' ? {
          'Klinke 3,5 mm': '3.5 mm audio jack',
          'Klinke 6,3 mm': '6.3 mm audio jack',
          'Cinch': 'RCA',
          'Schuko': 'Schuko connector',
          'dc-in': 'DC input',
          'Serial': 'Serial port',
          'Parallel': 'Parallel port',
          'micro SD': 'microSD',
          'CF': 'CompactFlash',
          'Sonstiges': 'Other'
        } : {
          'Serial': 'Seriell',
          'dc-in': 'DC-Eingang',
          'micro SD': 'microSD',
          'CF': 'CompactFlash'
        };
        return labels[portType] || portType;
      }

      function getPortSideLabel(side) {
        if (state.lang === 'en') return ({ left: 'left', right: 'right', top: 'top', bottom: 'bottom' })[side] || side;
        return ({ left: 'links', right: 'rechts', top: 'oben', bottom: 'unten' })[side] || side;
      }

      function getPortSpeedLabel(speed) {
        return state.lang === 'en' && speed === 'Standard' ? 'Default' : speed;
      }

      function getCableTypeLabel(type) {
        const germanLabels = {
          Fiber: 'Glasfaser / Fiber',
          DAC: 'DAC (Direct Attach Copper)',
          Cat6: 'Cat6'
        };
        if (state.lang !== 'en') return germanLabels[type] || type;
        const labels = {
          'Strom': 'Power',
          'Stromkabel': 'Power cable',
          Fiber: 'Fiber optic',
          DAC: 'DAC (Direct Attach Copper)',
          Cat6: 'Cat6',
          'Sonstiges': 'Other'
        };
        return labels[type] || type;
      }

      function getPortDisplayLabel(label) {
        if (state.lang !== 'en' || !label) return label || '';
        if (label === 'Stromanschluss') return 'Power input';
        if (label === 'Einspeisung IEC C20') return 'IEC C20 power input';
        let match = label.match(/^Steckdose (\d+)$/);
        if (match) return `Power outlet ${match[1]}`;
        match = label.match(/^IEC C13 Ausgang (\d+)$/);
        if (match) return `IEC C13 output ${match[1]}`;
        return label;
      }

      // Pointer interactions for moving devices around the workspace.
      function startDragging(event, deviceId) {
        const device = getDeviceById(deviceId);
        if (!device) return;
        const startX = event.clientX;
        const startY = event.clientY;
        const initialX = device.x;
        const initialY = device.y;

        const move = (moveEvent) => {
          const deltaX = moveEvent.clientX - startX;
          const deltaY = moveEvent.clientY - startY;
          const nextX = clamp(initialX + deltaX / state.zoom, 10, CANVAS_WIDTH - device.w - 10);
          const nextY = clamp(initialY + deltaY / state.zoom, 10, CANVAS_HEIGHT - device.h - 10);
          device.x = nextX;
          device.y = nextY;
          renderDevices();
          renderCables();
        };

        const stop = () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', stop);
          saveState();
        };

        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', stop);
      }

      // Project backup: export a file, or load one back into the planner.
      function exportJson() {
        const payload = JSON.stringify({
          devices: Array.from(state.devices.values()),
          cables: Array.from(state.cables.values()),
          lang: state.lang,
          theme: state.theme,
          zoom: state.zoom,
          selectedCableType: state.selectedCableType,
          maxPowerWatt: state.maxPowerWatt,
        }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'serverplaner.json';
        link.click();
        URL.revokeObjectURL(url);
      }

      function importJsonFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(String(event.target.result));
            if (!parsed || !Array.isArray(parsed.devices)) throw new Error('invalid');
            state.devices = new Map((parsed.devices || []).map((device) => [device.id, device]));
            state.cables = new Map((parsed.cables || []).map((cable) => [cable.id, cable]));
            state.lang = parsed.lang || state.lang;
            if (parsed.theme === 'dark' || parsed.theme === 'light') state.theme = parsed.theme;
            if (Number.isFinite(Number(parsed.zoom))) state.zoom = clamp(Number(parsed.zoom), MIN_ZOOM, MAX_ZOOM);
            state.selectedCableType = parsed.selectedCableType || state.selectedCableType;
            state.maxPowerWatt = parsed.maxPowerWatt || MAX_POWER_WATT;
            state.selectedDeviceId = null;
            state.selectedCableId = null;
            state.selectedPort = null;
            applyZoom(false);
            saveState();
            render();
            showToast(t('imported'));
          } catch (error) {
            showToast(t('invalidJson'));
          }
        };
        reader.readAsText(file);

          state.selectedDeviceId = state.hoveredDeviceId;
          state.selectedCableId = null;

      function setZoom(zoom) {
        const nextZoom = Math.round(clamp(zoom, MIN_ZOOM, MAX_ZOOM) * 100) / 100;
        if (nextZoom === state.zoom) return;

        applyZoom();
        saveState();

      function applyZoom(preserveCenter = true) {
        const shell = ui.canvas.parentElement;
        const shellRect = shell.getBoundingClientRect();
        const contentRect = ui.canvasContent.getBoundingClientRect();
        const contentLeft = contentRect.left - shellRect.left - shell.clientLeft + shell.scrollLeft;
        const contentTop = contentRect.top - shellRect.top - shell.clientTop + shell.scrollTop;
        const previousZoom = Number(ui.canvas.dataset.zoom || 1);
        const focusX = (shell.scrollLeft + shell.clientWidth / 2 - contentLeft) / previousZoom;
        const focusY = (shell.scrollTop + shell.clientHeight / 2 - contentTop) / previousZoom;

        ui.canvas.style.width = `${CANVAS_WIDTH * state.zoom}px`;
        ui.canvas.style.height = `${CANVAS_HEIGHT * state.zoom}px`;
        ui.canvasContent.style.transform = `scale(${state.zoom})`;
        ui.canvas.style.backgroundSize = `${22 * state.zoom}px ${22 * state.zoom}px`;
        ui.canvas.dataset.zoom = String(state.zoom);

        if (preserveCenter && previousZoom !== state.zoom) {
          shell.scrollLeft = contentLeft + focusX * state.zoom - shell.clientWidth / 2;
          shell.scrollTop = contentTop + focusY * state.zoom - shell.clientHeight / 2;
        }
        ui.zoomLevel.textContent = `${Math.round(state.zoom * 100)}%`;
        ui.zoomOutBtn.disabled = state.zoom <= MIN_ZOOM;
        ui.zoomInBtn.disabled = state.zoom >= MAX_ZOOM;

  function cloneDevice(sourceId) {
    const source = state.devices.get(sourceId);
    if (!source) return;
    const clone = JSON.parse(JSON.stringify(source));
    clone.id = uid('device');
    delete clone.rackStartU; // A duplicate starts unplaced so it cannot overlap its source in the rack.
    const baseName = String(source.name || (state.lang === 'en' ? 'Device' : 'Gerät')).replace(/ \(Kopie(?: \d+)?\)$/i, '');
    let copyNumber = 1;
    let copyName = `${baseName} (Kopie)`;
    const existingNames = new Set([...state.devices.values()].map((device) => String(device.name || '').toLocaleLowerCase()));
    while (existingNames.has(copyName.toLocaleLowerCase())) { copyNumber++; copyName = `${baseName} (Kopie ${copyNumber})`; }
    clone.name = copyName;
    clone.ports = (source.ports || []).map((port) => ({ ...port, id: uid('port'), cableId: null }));
    // Never duplicate a static IP address onto a second device.
    clone.ipAddress = '';
    const baseHeight = Number(clone.extraBaseHeight) || Number(source.h) || 135;
    clone.extraBaseHeight = baseHeight;
    clone.h = Math.max(baseHeight, (Number(clone.rackU) || 1) * 35);
    const maxX = Math.max(10, CANVAS_WIDTH - (Number(clone.w) || 190) - 10);
    const maxY = Math.max(10, CANVAS_HEIGHT - (Number(clone.h) || 135) - 10);
    let x = Math.min(maxX, Math.max(10, Number(source.x) + 32));
    let y = Math.min(maxY, Math.max(10, Number(source.y) + 32));
    const overlaps = (px, py) => [...state.devices.values()].some((device) => px < device.x + device.w && px + clone.w > device.x && py < device.y + device.h && py + clone.h > device.y);
    let tries = 0;
    while (overlaps(x, y) && tries < 12) {
      x = Math.min(maxX, Math.max(10, x + 28));
      y = Math.min(maxY, Math.max(10, y + (tries % 2 ? 24 : 0)));
      if (x >= maxX) x = 10;
      tries++;
    }
    clone.x = x; clone.y = y;
    state.devices.set(clone.id, clone);
    state.selectedDeviceId = clone.id;
    state.selectedCableId = null;
    if (typeof checkedStatus !== 'undefined') checkedStatus.delete(clone.id);
    saveState(); render();
    if (typeof showToast === 'function') showToast(state.lang === 'en' ? 'Device duplicated. Check its IP address and connections.' : 'Gerät dupliziert. IP-Adresse und Kabelverbindungen prüfen.');
  }
